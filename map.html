<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ユメっ子探せ</title>
<style>
  body {
    margin: 0;
    background: #222;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    color: #fff;
    font-family: sans-serif;
    overflow: hidden;
  }
  canvas {
    background: #000;
    border: 4px solid #fff;
  }
  #nameForm, #chatForm {
    display: flex;
    gap: 5px;
    margin-bottom: 5px;
  }
  #nameForm input, #chatForm input {
    padding: 5px;
    font-size: 16px;
  }
  #chatForm input { flex: 1; }
  #touchControls {
    position: absolute;
    bottom: 10px;
    display: flex;
    gap: 10px;
  }
  .touchButton {
    width: 60px;
    height: 60px;
    background: rgba(255,255,255,0.3);
    color: #fff;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    user-select: none;
    touch-action: none;
  }
</style>
</head>
<body>

<form id="nameForm">
  <input type="text" id="playerName" placeholder="名前を入力" maxlength="10">
  <button type="submit">決定</button>
</form>

<form id="chatForm">
  <input type="text" id="chatInput" placeholder="チャットを入力" maxlength="50">
  <button type="submit">送信</button>
</form>

<canvas id="game" width="400" height="300"></canvas>

<div id="touchControls" style="display:none;">
  <div class="touchButton" data-key="w">↑</div>
  <div class="touchButton" data-key="s">↓</div>
  <div class="touchButton" data-key="a">←</div>
  <div class="touchButton" data-key="d">→</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getDatabase, ref, set, onValue, remove, onChildAdded, push, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

/* ====================== Firebase ====================== */
const firebaseConfig = {
  apiKey: "AIzaSyAXO76mF3C0TQAHkFsFUqDsI6JXOqGgMlw",
  authDomain: "zzonline.firebaseapp.com",
  databaseURL: "https://zzonline-default-rtdb.firebaseio.com",
  projectId: "zzonline",
  storageBucket: "zzonline.firebasestorage.app",
  messagingSenderId: "50179905692",
  appId: "1:50179905692:web:12b9664ac730e6a58d3559",
  measurementId: "G-NMVHG2XN1F"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ====================== ユーザーID ====================== */
let userId = sessionStorage.getItem('userId');
if(!userId){
  userId = 'user_' + Date.now() + '_' + Math.floor(Math.random()*1000);
  sessionStorage.setItem('userId', userId);
}

/* ====================== 名前 ====================== */
let playerName = localStorage.getItem('playerName') || '';
const nameForm = document.getElementById('nameForm');
const nameInput = document.getElementById('playerName');
if(playerName) nameForm.style.display='none';

nameForm.addEventListener('submit', (e)=>{
  e.preventDefault();
  if(!nameInput.value.trim()) return;
  playerName = nameInput.value.trim();
  localStorage.setItem('playerName', playerName);
  nameForm.style.display='none';

  const q = query(ref(db,'players'), orderByChild('name'), equalTo(playerName));
  onValue(q, snapshot=>{
    const data = snapshot.val();
    if(data){
      for(const id in data){
        if(id!==userId) remove(ref(db,'players/'+id));
      }
    }
  },{onlyOnce:true});

  /* ===== 入室ログを送信（ここが重要） ===== */
  push(ref(db,'enterLogs'),{
    userId,
    name: playerName,
    timestamp: Date.now()
  });
});

/* ====================== Canvas ====================== */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

/* ====================== プレイヤー ====================== */
const player = { x:80,y:30,size:24,speed:1.2,img:new Image(),imgLoaded:false };
player.img.src='https://picsum.photos/seed/player/48';
player.img.onload=()=>player.imgLoaded=true;

const otherPlayers = {};
const otherImages = {};

/* ====================== マップ ====================== */
const maps={
  '0,0':{name:'スタート',bg:'https://picsum.photos/id/1015/400/300',objects:[
    {type:'block',x:150,y:80,w:64,h:64,img:'https://picsum.photos/id/1056/64/64'},
    {type:'event',x:60,y:200,w:80,h:40,event:'A'}
  ]},
  '1,0':{name:'右の森',bg:'https://picsum.photos/id/1020/400/300',objects:[
    {type:'block',x:220,y:120,w:64,h:64,img:'https://picsum.photos/id/1062/64/64'}
  ]},
  '-1,0':{name:'左の森',bg:'https://picsum.photos/id/1016/400/300',objects:[
    {type:'block',x:150,y:80,w:64,h:64,img:'https://picsum.photos/id/1056/64/64'},
    {type:'grass',x:60,y:200,w:80,h:40,event:'A'}
  ]}
};

const images={},status={};
function loadImage(k,s){
  const i=new Image();status[k]='loading';
  i.onload=()=>status[k]='loaded';
  i.src=s;images[k]=i;
}
for(const k in maps){
  loadImage(`bg_${k}`,maps[k].bg);
  maps[k].objects.forEach((o,i)=>{if(o.img)loadImage(`obj_${k}_${i}`,o.img);});
}

/* ====================== 入力 ====================== */
const keyState={};
addEventListener('keydown',e=>keyState[e.key.toLowerCase()]=true);
addEventListener('keyup',e=>keyState[e.key.toLowerCase()]=false);

/* ====================== Firebase 同期 ====================== */
const playersRef=ref(db,'players');
function sendPosition(){
  set(ref(db,'players/'+userId),{
    x:player.x,y:player.y,mapX,mapY,
    name:playerName,imgUrl:player.img.src,
    timestamp:Date.now()
  });
}
onValue(playersRef,s=>{
  const d=s.val()||{};
  for(const id in d) if(id!==userId) otherPlayers[id]=d[id];
});

/* ====================== 入室通知（完成形） ====================== */
const joinNotifications=[];
const chime=new Audio('https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/Chime.mp3');
const enterTime=Date.now();

onChildAdded(ref(db,'enterLogs'),snap=>{
  const d=snap.val();
  if(!d) return;
  if(d.userId===userId) return;
  if(d.timestamp<enterTime) return;

  chime.currentTime=0;
  chime.play();
  joinNotifications.push({name:d.name||'名無し',time:Date.now()});
});

/* ====================== チャット ====================== */
const chatForm=document.getElementById('chatForm');
const chatInput=document.getElementById('chatInput');
const chatsRef=ref(db,'chats');
let activeChats=[];

chatForm.addEventListener('submit',e=>{
  e.preventDefault();
  const msg=chatInput.value.trim();
  if(!msg) return;
  chatInput.value='';
  push(chatsRef,{userId,name:playerName,msg,mapX,mapY,timestamp:Date.now()});
});

onChildAdded(chatsRef,s=>{
  const c=s.val();
  if(c.mapX!==mapX||c.mapY!==mapY) return;
  if(Date.now()-enterTime<5000) return;
  activeChats.push({...c,time:Date.now()});
  new Audio('https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/chat.mp3').play();
});

/* ====================== ループ ====================== */
let mapX=0,mapY=0;
function update(){
  if(keyState.w)player.y-=player.speed;
  if(keyState.s)player.y+=player.speed;
  if(keyState.a)player.x-=player.speed;
  if(keyState.d)player.x+=player.speed;
  if(playerName)sendPosition();
}
function draw(){
  const key=`${mapX},${mapY}`;
  if(status[`bg_${key}`]==='loaded')ctx.drawImage(images[`bg_${key}`],0,0,W,H);
  for(const id in otherPlayers){
    const p=otherPlayers[id];
    if(p.mapX===mapX&&p.mapY===mapY){
      ctx.fillRect(p.x,p.y,24,24);
      ctx.fillText(p.name,p.x,p.y-4);
    }
  }
  ctx.fillRect(player.x,player.y,24,24);
  joinNotifications.forEach(n=>{
    if(Date.now()-n.time<3000){
      ctx.fillText(`${n.name}さんが出撃`,10,35);
    }
  });
}
(function loop(){update();draw();requestAnimationFrame(loop);})();
window.addEventListener('beforeunload',()=>remove(ref(db,'players/'+userId)));
</script>
</body>
</html>
