<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>  </title>
<style>
body { margin: 0; background: #222; color: #fff; font-family: sans-serif; overflow: hidden; position: relative; height: 100vh;}
canvas { background: #000; border: 4px solid #fff; width: 400px; height: 300px; display: block; }
#nameForm, #chatForm { display: flex; gap: 5px; margin-bottom: 5px; position: absolute; z-index: 10; }
#nameForm input, #chatForm input { padding: 5px; font-size: 16px; }
#chatForm input { flex: 1; }
#touchControls { position: absolute; bottom: 80px; display: flex; gap: 10px; z-index: 10; }
.touchButton { width: 60px; height: 60px; background: rgba(255,255,255,0.3); color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center; border-radius: 10px; user-select: none; touch-action: none; }
#extraButtons { position: absolute; bottom: 150px; display:flex; gap:10px; z-index: 10; }
#extraButtons .touchButton { background: rgba(0,200,255,0.4); }
#sideUI{ position:absolute; right:20px; top:50%; transform:translateY(-50%); width:200px; text-align:center; z-index:15; }
#zoneImage{ width:100%; display:none; }
#zoneText{ margin-top:8px; font-size:14px; }
.volumeBox{ margin-top:20px; }
.countdownSmall{ position:absolute; right:8px; bottom:8px; z-index:30; background:rgba(0,0,0,0.5); padding:4px 8px; border-radius:6px; font-size:12px; display:none; color:#fff; }
</style>
</head>
<body>

<!--
変更点メモ（重要）
- イベント（全体TP 等）の設定は UI からではなく、下のスクリプト内の CONFIG_EVENT / CONFIG_PHASES を直接編集して設定してください。
- 真っ白になった後は 10 分(600秒) 真っ白なまま維持され、その後イベントは終了します（元の表示に戻る）。
- 夜・日の出システムはコード内の CONFIG_PHASES に A/B/C の時刻を入れてください。
  - A の時刻になると即座に夜フィルター（暗く）になります。
  - B の「1分前」から 60秒かけて夜フィルターが減衰し、同時に右上で日の出風の明るさが増していきます。
  - C の時刻になると確実にフィルターは除去されます（元に戻る）。
- 動画を canvas に描画する際は CORS の制約に注意してください（同一オリジン、あるいは Access-Control-Allow-Origin が許可されたホストを推奨）。
-->

<form id="nameForm">
  <input type="text" id="playerName" placeholder="名前を入力" maxlength="10">
  <button type="submit">決定</button>
</form>

<form id="chatForm" style="top: 10px; left: 10px;">
  <input type="text" id="chatInput" placeholder="チャットを入力" maxlength="50">
  <button type="submit">送信</button>
</form>

<div id="sideUI">
  <img id="zoneImage" src="" />
  <div id="zoneText"></div>
  <div class="volumeBox">
    <label>BGM音量</label>
    <input type="range" id="bgmVolume" min="0" max="1" step="0.01" value="0.6">
  </div>
  <div style="margin-top:12px; font-size:12px; opacity:0.8;"></div>
</div>

<canvas id="game" width="400" height="300"></canvas>

<div id="touchControls" style="display:none;">
  <div class="touchButton" data-key="w">↑</div>
  <div class="touchButton" data-key="s">↓</div>
  <div class="touchButton" data-key="a">←</div>
  <div class="touchButton" data-key="d">→</div>
</div>

<div id="extraButtons" style="display:none;">
  <div class="touchButton" data-key="shift">shift</div>
  <div class="touchButton" data-key="space">探す</div>
</div>

<div id="countdown" class="countdownSmall"></div>

<!-- video element used for event (will be drawn to canvas) -->
<video id="eventVideoElem" playsinline webkit-playsinline crossorigin="anonymous" style="display:none; position:absolute; left:0; top:0; width:400px; height:300px; object-fit:cover; z-index:5;"></video>

   ================================
   CONFIG_EVENT:
     enabled: true/false -- イベント機能全体の有効無効
     time: "HH:MM" (東京時間) 発火時刻（全員TP等）
     audio: MP3 の URL（空なら再生しない）
     video: MP4 の URL（空なら描画しない）
     target: { mapX, mapY, x, y } ターゲット座標
   CONFIG_PHASES:
     A: "HH:MM" -- 夜（即座に暗くなる）
     B: "HH:MM" -- B の 1 分前からフィルター解除（60s）と日の出演出
     C: "HH:MM" -- 完全解除
   その他:
     NIGHT_ALPHA: 夜時にかける暗さの強さ（0..1）
     AVATAR_FADE_SEC: アバターが下から消える演出の秒数
     WHITE_FADE_SEC: 白くなるアニメの秒数
     WHITE_HOLD_SEC: 真っ白になったあと保持する秒数（ここは要求通り 600）
*/

  enabled: true,
  time: "05:07", // 東京時間で発火する時刻をここで指定
  audio: "https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/kieru.mp3",     // 例: "https://......mp3"
  video: "",     // 例: "https://......mp4"
  target: { mapX: 100, mapY: 0, x: 150, y: 120 } // 発火時に全員TPする場所
};

const CONFIG_PHASES = {
  A: "4:00", // 例: 夜開始
  B: "06:03", // B の時刻
  C: "07:00"  // C の時刻で解除
};

const NIGHT_ALPHA = 800000000000000000; // 夜にかける暗さ（0..1）
const AVATAR_FADE_SEC = 100; // アバターが下から消える演出（秒）
const WHITE_FADE_SEC = 10;   // 白くなるフェード（秒）
const WHITE_HOLD_SEC = 6000;  // 真っ白になってから保持する秒（10分 = 600s）
const PREB_SEC = 60;         // B の1分前からフィルターを外し始める（60s）

  nameForm.style.display='none';

    }
  }
  sendPosition();
  sessionStorage.setItem('enterTime', Date.now());
});

  if(ev){ ev.style.transform = canvas.style.transform; ev.style.transformOrigin = 'top left'; ev.style.left = canvas.style.left; ev.style.top = canvas.style.top; ev.style.position='absolute'; }

/* --- BGM 管理 --- */

const albumBgmAudio = new Audio(); albumBgmAudio.loop = false; albumBgmAudio.volume = 0.6;
const bgmVolume = document.getElementById('bgmVolume');
bgmVolume.addEventListener('input', ()=>{ singleBgmAudio.volume = bgmVolume.value; albumBgmAudio.volume  = bgmVolume.value; });

function playSingleBgm(url){ if(singleBgmAudio.src !== url){ singleBgmAudio.src = url; singleBgmAudio.play().catch(()=>{}); } }
function stopSingleBgm(){ singleBgmAudio.pause(); singleBgmAudio.currentTime = 0; }
let albumList=[], albumIndex=0, albumActive=false;
function playAlbum(list){ if(albumActive && JSON.stringify(albumList)===JSON.stringify(list)) return; albumList=list; albumIndex=0; albumActive=true; albumBgmAudio.src=albumList[albumIndex]; albumBgmAudio.play().catch(()=>{}); albumBgmAudio.onended=()=>{ if(!albumActive) return; albumIndex=(albumIndex+1)%albumList.length; albumBgmAudio.src=albumList[albumIndex]; albumBgmAudio.play().catch(()=>{}); }; }
function stopAlbum(){ albumActive=false; albumBgmAudio.pause(); albumBgmAudio.currentTime=0; }
function checkBgmZone(){
  let singleHit=null, albumHit=null;
  for(const zone of worldBgmZones){
    if(mapX>=zone.mapX1 && mapX<=zone.mapX2 && mapY>=zone.mapY1 && mapY<=zone.mapY2){
      if(zone.type==='single') singleHit=zone;
      if(zone.type==='album') albumHit=zone;
    }
  }
  if(singleHit) playSingleBgm(singleHit.url); else stopSingleBgm();
  if(albumHit) playAlbum(albumHit.list); else stopAlbum();
}

/* --- 画像／ピクセルデータ読み込み --- */
const imagePixelData = {}; // key -> {data,width,height} or null
const images = {};
const status = {};
function loadImage(key, src){
  if(!src){ status[key]='none'; imagePixelData[key]=null; return; }
  const img = new Image();
  status[key]='loading';
  img.crossOrigin = 'anonymous';
  img.onload = ()=>{
    status[key]='loaded';
    images[key]=img;
    try{
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      const cx = c.getContext('2d');
      cx.drawImage(img,0,0);
      const imageData = cx.getImageData(0,0,c.width,c.height);
      imagePixelData[key] = { data: imageData.data, width: imageData.width, height: imageData.height };
    }catch(e){
      imagePixelData[key] = null;
    }
  };
  img.onerror = ()=>{ status[key]='error'; imagePixelData[key] = null; images[key]=img; };
  img.src = src;
}
for(const k in maps){
  loadImage(`bg_${k}`, maps[k].bg);
  if(maps[k].collisionMask) loadImage(`mask_${k}`, maps[k].collisionMask);
  maps[k].objects.forEach((o,i)=>{ if(o.img) loadImage(`obj_${k}_${i}`, o.img); });
}

/* --- 衝突判定（円: 足元） --- */
function rectsOverlap(a,b){ return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function getPlayerFootCircle(p){
  const diameter = Math.max(1, p.size / 3);
  const r = diameter / 2;
  const cx = p.x + p.size / 2;
  const cy = p.y + p.size - r;
  return { cx, cy, r };
}
function circleRectOverlap(circle, rect){
  const nearestX = Math.max(rect.x, Math.min(circle.cx, rect.x + rect.w));
  const nearestY = Math.max(rect.y, Math.min(circle.cy, rect.y + rect.h));
  const dx = circle.cx - nearestX;
  const dy = circle.cy - nearestY;
  return (dx * dx + dy * dy) <= (circle.r * circle.r);
}
function pointInCircle(circle, x, y){ const dx = circle.cx - x; const dy = circle.cy - y; return (dx*dx + dy*dy) <= (circle.r * circle.r); }

/* --- マスク判定（円サポート） --- */
function isPassableByMapMask(mapKey, footCircle){
  const maskKey = `mask_${mapKey}`;
  const pixel = imagePixelData[maskKey];
  if(!pixel) return true;
  const pw = W, ph = H;
  const scaleX = pixel.width / pw, scaleY = pixel.height / ph;
  const sampleStep = Math.max(1, Math.floor((footCircle.r * 2) / 4));
  const startX = Math.max(0, Math.floor(footCircle.cx - footCircle.r));
  const startY = Math.max(0, Math.floor(footCircle.cy - footCircle.r));
  const endX = Math.min(pw - 1, Math.floor(footCircle.cx + footCircle.r));
  const endY = Math.min(ph - 1, Math.floor(footCircle.cy + footCircle.r));
  for(let yy = startY; yy <= endY; yy += sampleStep){
    for(let xx = startX; xx <= endX; xx += sampleStep){
      if(!pointInCircle(footCircle, xx, yy)) continue;
      const mx = Math.floor(xx * scaleX);
      const my = Math.floor(yy * scaleY);
      if(mx < 0 || mx >= pixel.width || my < 0 || my >= pixel.height) continue;
      const idx = (my * pixel.width + mx) * 4 + 3;
      if(pixel.data[idx] > 10) return false;
    }
  }
  return true;
}

/* --- オブジェクト用のピクセル判定（円） --- */
function isPassableByObjectPixel(mapKey, objIndex, footCircle, obj){
  const pixelKey = `obj_${mapKey}_${objIndex}`;
  const pixel = imagePixelData[pixelKey];
  if(!pixel) return null;
  const scaleX = pixel.width / obj.w, scaleY = pixel.height / obj.h;
  const sampleStep = Math.max(1, Math.floor((footCircle.r * 2) / 4));
  const startX = Math.max(0, Math.floor((footCircle.cx - footCircle.r) - obj.x));
  const startY = Math.max(0, Math.floor((footCircle.cy - footCircle.r) - obj.y));
  const endX = Math.min(obj.w - 1, Math.floor((footCircle.cx + footCircle.r) - obj.x));
  const endY = Math.min(obj.h - 1, Math.floor((footCircle.cy + footCircle.r) - obj.y));
  for(let yy = startY; yy <= endY; yy += sampleStep){
    for(let xx = startX; xx <= endX; xx += sampleStep){
      const worldX = obj.x + xx;
      const worldY = obj.y + yy;
      if(!pointInCircle(footCircle, worldX, worldY)) continue;
      const mx = Math.floor(xx * scaleX);
      const my = Math.floor(yy * scaleY);
      if(mx < 0 || mx >= pixel.width || my < 0 || my >= pixel.height) continue;
      const idx = (my * pixel.width + mx) * 4 + 3;
      if(pixel.data[idx] > 10) return false;
    }
  }
  return true;
}

const activeObjectsRef = ref(db, 'activeObjects');
let activeObjects = {};
const playingAudios = {};
const objectNotes = {};
const RADIO_MAX_DIST = 220;

onValue(activeObjectsRef, snap=>{
  activeObjects = snap.val() || {};
  syncPlayingAudiosWithActiveObjects();
});

function makeUniqueKey(mapKey, idx){ return `${mapKey}#${idx}`; }
function parseUniqueKey(uniqueKey){
  const sep = uniqueKey.lastIndexOf('#');
  return { mapKey: uniqueKey.substring(0, sep), index: uniqueKey.substring(sep+1) };
}

async function toggleObjectActive(mapKey, index){
  const objRef = ref(db, `activeObjects/${mapKey}/${index}`);
  const snap = await get(objRef);
  if(snap.exists() && snap.val() && snap.val().active){
    remove(objRef).catch(()=>{});
  }else{
    set(objRef, { active:true, startedBy:userId, timestamp:Date.now() }).catch(()=>{});
  }
}

function syncPlayingAudiosWithActiveObjects(){
  const currentMapKey = `${mapX},${mapY}`;
  for(const mapKey in activeObjects){
    const mEntry = activeObjects[mapKey] || {};
    for(const idx in mEntry){
      const info = mEntry[idx];
      const uniqueKey = makeUniqueKey(mapKey, idx);
      const shouldBeActive = info && info.active;
      if(shouldBeActive){
        if(mapKey === currentMapKey && !playingAudios[uniqueKey]){
          if(maps[mapKey] && maps[mapKey].objects[idx]){
            startObjectAudio(mapKey, idx, maps[mapKey].objects[idx]);
          }
        }
      }
    }
  }
  for(const uniq in Object.keys(playingAudios).map(k=>k)){
    const uniqueKey = Object.keys(playingAudios)[uniq];
    const parsed = parseUniqueKey(uniqueKey);
    const mp = parsed.mapKey;
    const idx = parsed.index;
    if(!activeObjects[mp] || !activeObjects[mp][idx] || !activeObjects[mp][idx].active){
      stopObjectAudio(uniqueKey, true);
    } else {
      if(mp !== `${mapX},${mapY}`){
        stopObjectAudio(uniqueKey, true);
      }
    }
  }
}

function startObjectAudio(mapKey, index, obj){
  const uniqueKey = makeUniqueKey(mapKey, index);
  if(playingAudios[uniqueKey]) return;
  if(!obj || !obj.audio) return;
  const a = new Audio(obj.audio);
  a.loop = false;
  a.preload = 'auto';
  a.volume = 0;
  try{ a.play().catch(()=>{}); }catch(e){}
  a.onended = async ()=>{
    try{ await remove(ref(db, `activeObjects/${mapKey}/${index}`)).catch(()=>{}); }catch(e){}
    delete playingAudios[uniqueKey];
    delete objectNotes[uniqueKey];
  };
  playingAudios[uniqueKey] = { audio: a, mapKey, index, obj };
  objectNotes[uniqueKey] = objectNotes[uniqueKey] || [];
}

function stopObjectAudio(uniqueKey, remoteStop = false){
  const entry = playingAudios[uniqueKey];
  if(!entry) return;
  try{ entry.audio.pause(); entry.audio.currentTime = 0; }catch(e){}
  delete playingAudios[uniqueKey];
  delete objectNotes[uniqueKey];
  if(!remoteStop){
    const p = parseUniqueKey(uniqueKey);
    remove(ref(db, `activeObjects/${p.mapKey}/${p.index}`)).catch(()=>{});
  }
}

/* --- インタラクト管理 --- */
let currentInteract = null;
const INTERACT_DISTANCE = 7;
let lastInteractDisplayTime = 0;

function findInteractableObject(){
  const key = `${mapX},${mapY}`;
  const map = maps[key];
  currentInteract = null;
  if(!map) return;
  const foot = getPlayerFootCircle(player);
  for(let i=0;i<map.objects.length;i++){
    const obj = map.objects[i];
    if(obj.type === 'radio' || obj.usable || obj.type === 'seat'){
      if(circleRectOverlap(foot, obj)){
        currentInteract = { mapKey: key, index: i, obj };
        lastInteractDisplayTime = Date.now();
        return;
      }else{
        const objCenterX = obj.x + obj.w/2;
        const objCenterY = obj.y + obj.h/2;
        const dx = foot.cx - objCenterX;
        const dy = foot.cy - objCenterY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if(dist <= INTERACT_DISTANCE){
          currentInteract = { mapKey: key, index: i, obj };
          lastInteractDisplayTime = Date.now();
          return;
        }
      }
    }
  }
}

/* --- seat (座る) 管理 --- */
function toggleSeat(mapKey, index){
  const obj = maps[mapKey].objects[index];
  if(!obj || obj.type !== 'seat') return;
  if(player.sitting && player.sitting.mapKey === mapKey && player.sitting.index == index){
    player.sitting = null;
    player.x = Math.min(Math.max(0, player.x + 2), W - player.size);
    sendPosition();
    return;
  }
  player.sitting = { mapKey, index, sitImg: obj.sitImg || null };
  player.x = obj.x + Math.max(0, (obj.w - player.size) / 2);
  player.y = obj.y + Math.max(0, obj.h - player.size);
  keyState['w']=keyState['a']=keyState['s']=keyState['d']=false;
  sendPosition();
}

/* --- ノートパーティクル --- */
function spawnNoteForObject(uniqueKey, obj){
  objectNotes[uniqueKey] = objectNotes[uniqueKey] || [];
  const x = obj.x + obj.w/2;
  const y = obj.y - 6;
  objectNotes[uniqueKey].push({ x, y, alpha: 1, dy: -0.25, vx: (Math.random()-0.5)*0.3 });
}

/* Global event local state */
let globalEventState = { active:false, startTime:0, audio:null, video:null, mapX:0, mapY:0, x:0, y:0, avatarFadeDur:AVATAR_FADE_SEC, whiteFadeDur:WHITE_FADE_SEC, whiteHoldDur:WHITE_HOLD_SEC };
const countdownElem = document.getElementById('countdown');
const eventVideoElem = document.getElementById('eventVideoElem');

async function startGlobalEvent(ev){
  if(!ev) return;
  if(globalEventState.active && globalEventState.startTime === ev.timestamp) return;
  globalEventState.active = true;
  globalEventState.startTime = ev.timestamp || Date.now();
  globalEventState.mapX = ev.mapX; globalEventState.mapY = ev.mapY; globalEventState.x = ev.x; globalEventState.y = ev.y;
  globalEventState.avatarFadeDur = ev.durationAvatarFade || AVATAR_FADE_SEC;
  globalEventState.whiteFadeDur = ev.whiteFadeDuration || WHITE_FADE_SEC;
  globalEventState.whiteHoldDur = ev.whiteHoldDuration || WHITE_HOLD_SEC;

  mapX = globalEventState.mapX; mapY = globalEventState.mapY;
  player.x = globalEventState.x; player.y = globalEventState.y;
  sendPosition(); checkUiZone(); checkBgmZone();

  // audio
  if(ev.audio){
    try{
      if(globalEventState.audio){ globalEventState.audio.pause(); }
      globalEventState.audio = new Audio(ev.audio);
      globalEventState.audio.loop = false;
      globalEventState.audio.volume = parseFloat(bgmVolume.value || 0.6);
      await globalEventState.audio.play().catch(()=>{});
    }catch(e){}
  }

  // video
  if(ev.video){
    try{
      const v = eventVideoElem;
      v.pause();
      v.src = ev.video;
      v.crossOrigin = 'anonymous';
      v.muted = true;
      v.loop = true;
      await v.play().catch(()=>{});
      v.style.display = 'block';
      resizeCanvas();
      globalEventState.video = v;
    }catch(e){}
  }

  // phases for event:
  globalEventState.phase = 'avatarFade';
  globalEventState.phaseStart = Date.now();
  // countdown UI
  countdownElem.style.display = 'block';
}

/* When ending, keep white for configured hold duration, then clear */
let whiteHoldTimeout = null;
function scheduleWhiteHoldEnd(){
  if(whiteHoldTimeout) clearTimeout(whiteHoldTimeout);
  whiteHoldTimeout = setTimeout(()=>{
    // clear event (stop audio/video and hide)
    if(globalEventState.audio){ try{ globalEventState.audio.pause(); }catch(e){} }
    if(globalEventState.video){ try{ globalEventState.video.pause(); globalEventState.video.style.display = 'none'; }catch(e){} }
    remove(ref(db,'system/event')).catch(()=>{});
    globalEventState = { active:false, startTime:0, audio:null, video:null, mapX:0, mapY:0, x:0, y:0, avatarFadeDur:AVATAR_FADE_SEC, whiteFadeDur:WHITE_FADE_SEC, whiteHoldDur:WHITE_HOLD_SEC };
    countdownElem.style.display = 'none';
  }, globalEventState.whiteHoldDur * 1000);
}

/* update event progression and transitions */
function updateGlobalEventProgress(){
  if(!globalEventState.active) return;
  const now = Date.now();
  const elapsed = (now - globalEventState.phaseStart) / 1000;
  if(globalEventState.phase === 'avatarFade'){
    if(elapsed >= globalEventState.avatarFadeDur){
      // move to white fade
      globalEventState.phase = 'whiteFade';
      globalEventState.phaseStart = Date.now();
    }
  } else if(globalEventState.phase === 'whiteFade'){
    if(elapsed >= globalEventState.whiteFadeDur){
      // reached full white -> hold for whiteHoldDur then clear
      globalEventState.phase = 'whiteHold';
      globalEventState.phaseStart = Date.now();
      // schedule end after hold duration
      scheduleWhiteHoldEnd();
    }
  }
}

/* render small countdown text */
function drawEventCountdown(){
  if(!globalEventState.active) return;
  const now = Date.now();
  let remaining = 0;
  if(globalEventState.phase === 'avatarFade'){
    const elapsed = (now - globalEventState.phaseStart) / 1000;
    remaining = Math.max(0, (globalEventState.avatarFadeDur - elapsed) + globalEventState.whiteFadeDur + globalEventState.whiteHoldDur);
  } else if(globalEventState.phase === 'whiteFade'){
    const elapsed = (now - globalEventState.phaseStart) / 1000;
    remaining = Math.max(0, (globalEventState.whiteFadeDur - elapsed) + globalEventState.whiteHoldDur);
  } else if(globalEventState.phase === 'whiteHold'){
    const elapsed = (now - globalEventState.phaseStart) / 1000;
    remaining = Math.max(0, (globalEventState.whiteHoldDur - elapsed));
  }
  countdownElem.textContent = `終了まで ${Math.ceil(remaining)}s`;
}

/* get avatar fade progress 0..1 */
function getAvatarFadeProgress(){
  if(!globalEventState.active) return 0;
  if(globalEventState.phase === 'avatarFade'){
    const elapsed = (Date.now() - globalEventState.phaseStart) / 1000;
    return Math.min(1, elapsed / globalEventState.avatarFadeDur);
  } else if(globalEventState.phase === 'whiteFade' || globalEventState.phase === 'whiteHold'){
    return 1;
  }
  return 0;
}

/* get white fade progress 0..1 */
function getWhiteFadeProgress(){
  if(!globalEventState.active) return 0;
  if(globalEventState.phase === 'whiteFade'){
    const elapsed = (Date.now() - globalEventState.phaseStart) / 1000;
    return Math.min(1, elapsed / globalEventState.whiteFadeDur);
  } else if(globalEventState.phase === 'whiteHold'){
    return 1;
  } else if(globalEventState.phase === 'avatarFade'){
    return 0;
  }
  return 0;
}

/* ===========================
   夜/日の出システム（コード内設定）
   - CONFIG_PHASES を編集して動作させます
   - A: 即夜（night alpha を NIGHT_ALPHA に）
   - B: B の 1 分前から 60s で night alpha を 0 にしつつ右上に日の出演出（60s）
   - C: 即解除（night alpha = 0）
   =========================== */

let nightFilterAlpha = 0; // 0..1
let phaseNow = null;
let prebStartTime = null; // when pre-B start (ms)
let prebEndTime = null;

function parseHHMMToTokyoDate(hhmm){
  if(!hhmm) return null;
  const parts = hhmm.split(':').map(s=>parseInt(s,10));
  if(parts.length !== 2 || isNaN(parts[0]) || isNaN(parts[1])) return null;
  const now = new Date(Date.now() + (new Date().getTimezoneOffset()*60000) + (9*3600*1000));
  now.setHours(parts[0], parts[1], 0, 0);
  return now;
}

function updatePhaseSchedules(){
  // compute times in local ms for A/B/C (Tokyo) for today
  const Adate = parseHHMMToTokyoDate(CONFIG_PHASES.A);
  const Bdate = parseHHMMToTokyoDate(CONFIG_PHASES.B);
  const Cdate = parseHHMMToTokyoDate(CONFIG_PHASES.C);

  const nowTokyoMs = Date.now() + (new Date().getTimezoneOffset()*60000) + (9*3600*1000);

  // A handling: if current tokyo time >= A and < B, set night
  const Ams = Adate ? Adate.getTime() : null;
  const Bms = Bdate ? Bdate.getTime() : null;
  const Cms = Cdate ? Cdate.getTime() : null;

  // If times are not provided, do nothing
  if(!Ams && !Bms && !Cms) return;

  // We need to convert back to epoch in local client timezone for comparisons.
  // We'll compare by transforming nowTokyoMs and targetMs into numbers and comparing equality up to minutes in periodic check.
}

/* periodic check every 5s to manage A/B/C transitions */
let lastPhaseCheckMinute = null;
setInterval(()=>{
  try{
    const nowTokyo = new Date(Date.now() + (new Date().getTimezoneOffset()*60000) + (9*3600*1000));
    const hhmm = `${nowTokyo.getHours().toString().padStart(2,'0')}:${nowTokyo.getMinutes().toString().padStart(2,'0')}`;
    if(hhmm === lastPhaseCheckMinute) return;
    lastPhaseCheckMinute = hhmm;

    // A
    if(CONFIG_PHASES.A && hhmm === CONFIG_PHASES.A){
      phaseNow = 'A';
      nightFilterAlpha = NIGHT_ALPHA;
      prebStartTime = null;
      prebEndTime = null;
    }

    // B: start pre-B one minute earlier (i.e., if current minute == B - 1)
    if(CONFIG_PHASES.B){
      // compute B minus 1 minute string
      const parts = CONFIG_PHASES.B.split(':').map(s=>parseInt(s,10));
      if(parts.length===2){
        const d = new Date();
        d.setHours(parts[0], parts[1], 0, 0);
        d.setMinutes(d.getMinutes() - 1);
        const preHHMM = `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
        if(hhmm === preHHMM){
          // start pre-B transition over PREB_SEC
          phaseNow = 'preB';
          prebStartTime = Date.now();
          prebEndTime = prebStartTime + PREB_SEC*1000;
        }
        if(hhmm === CONFIG_PHASES.B){
          // ensure full B behavior: transition should finish here but set explicitly
          phaseNow = 'B';
          prebStartTime = null;
          prebEndTime = null;
          nightFilterAlpha = 0;
        }
      }
    }

    // C: when C hits, remove filter immediately
    if(CONFIG_PHASES.C && hhmm === CONFIG_PHASES.C){
      phaseNow = 'C';
      nightFilterAlpha = 0;
      prebStartTime = null;
      prebEndTime = null;
    }
  }catch(e){}
}, 5000);

/* called on every frame to update night alpha if in preB */
function updateNightAndSunrise(){
  if(phaseNow === 'preB' && prebStartTime && prebEndTime){
    const now = Date.now();
    const t = Math.min(1, Math.max(0, (now - prebStartTime) / (prebEndTime - prebStartTime)));
    // interpolate from current nightFilterAlpha down to 0 (we'll assume it started at NIGHT_ALPHA)
    nightFilterAlpha = NIGHT_ALPHA * (1 - t);
    // also set sunrise intensity as t (used in draw)
    sunriseIntensity = t;
    if(t >= 1){
      phaseNow = 'B';
      prebStartTime = null;
      prebEndTime = null;
    }
  } else {
    // ensure sunriseIntensity reset when not preB
    if(phaseNow !== 'preB') sunriseIntensity = 0;
  }
}
/* sunrise intensity 0..1 */
let sunriseIntensity = 0;

/* draw sunrise effect (right-top) */
function drawSunriseEffect(){
  if(sunriseIntensity <= 0) return;
  // draw radial gradient centered near top-right
  const gx = W - 30;
  const gy = 30;
  const radius = 220;
  const g = ctx.createRadialGradient(gx, gy, 10, gx, gy, radius);
  // color stops tuned to look like sunrise; intensity affects alpha
  g.addColorStop(0, `rgba(255, 230, 170, ${0.9 * sunriseIntensity})`);
  g.addColorStop(0.3, `rgba(255, 200, 120, ${0.5 * sunriseIntensity})`);
  g.addColorStop(1, `rgba(255, 200, 120, ${0})`);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
}

/* ===========================
   更新 / 描画
   =========================== */

function update() {
  const key = mapX + ',' + mapY;
  if(!maps[key]) {
    player.x = Math.max(0, Math.min(player.x, W - player.size));
    player.y = Math.max(0, Math.min(player.y, H - player.size));
    return;
  }
  const map = maps[key];

  const ox = player.x, oy = player.y;
  player.moving = false;
  player.crouch = player.shift;

  if(!player.sitting){
    if (keyState.w) { player.y -= player.speed; player.dir = 'up'; player.moving = true; }
    if (keyState.s) { player.y += player.speed; player.dir = 'down'; player.moving = true; }
    if (keyState.a) { player.x -= player.speed; player.dir = 'left'; player.moving = true; }
    if (keyState.d) { player.x += player.speed; player.dir = 'right'; player.moving = true; }
  }

  const anyMoveKey = keyState['w'] || keyState['a'] || keyState['s'] || keyState['d'];
  if(anyMoveKey && !footstepPlaying){
    try{ footstepAudio.currentTime = 0; footstepAudio.play(); }catch(e){}
    footstepPlaying = true;
  }else if(!anyMoveKey && footstepPlaying){
    try{ footstepAudio.pause(); footstepAudio.currentTime = 0; }catch(e){}
    footstepPlaying = false;
  }

  if(anyMoveKey) lastInteractDisplayTime = Date.now();

  for (const obj of map.objects){
    if (obj.type === 'gate'){
      const need = (typeof countPlayersInRange === 'function') ? countPlayersInRange(obj) : (obj.need || 1);
      const near = (typeof playersNearGate === 'function') ? playersNearGate(obj) : 0;
      if (near >= need){
        for (const id in otherPlayers){
          const p = otherPlayers[id];
          if (p.mapX>=obj.range.mapX1 && p.mapX<=obj.range.mapX2 && p.mapY>=obj.range.mapY1 && p.mapY<=obj.range.mapY2){
            set(ref(db,'players/'+id),{ ...p, mapX:obj.to.mapX, mapY:obj.to.mapY, x:obj.to.x, y:obj.to.y, timestamp:Date.now() });
          }
        }
        mapX = obj.to.mapX; mapY = obj.to.mapY; player.x = obj.to.x; player.y = obj.to.y;
      }
    }
  }

  const foot = getPlayerFootCircle(player);
  let blockedByObject = false;
  for(let i=0;i<map.objects.length;i++){
    const obj = map.objects[i];
    if(!circleRectOverlap(foot, obj)) continue;
    if(obj.type === 'block'){
      const objPixelResult = isPassableByObjectPixel(key, i, foot, obj);
      if(objPixelResult === false){ blockedByObject = true; break; }
      else if(objPixelResult === null){ blockedByObject = circleRectOverlap(foot, obj); if(blockedByObject) break; }
    }
    if(obj.type === 'warp'){ if(circleRectOverlap(foot, obj)){ player.x = obj.to.x; player.y = obj.to.y; mapX = obj.to.mapX; mapY = obj.to.mapY; } }
  }

  let blockedByMapMask = false;
  if(!blockedByObject){
    const passable = isPassableByMapMask(key, foot);
    if(!passable) blockedByMapMask = true;
  }
  if(blockedByObject || blockedByMapMask){ player.x = ox; player.y = oy; }

  let nx = mapX, ny = mapY;
  let movedTile = false;
  if (player.x < 0) { nx--; movedTile = true; }
  if (player.x + player.size > W) { nx++; movedTile = true; }
  if (player.y < 0) { ny--; movedTile = true; }
  if (player.y + player.size > H) { ny++; movedTile = true; }
  if (movedTile) {
    if (maps[nx + ',' + ny]) {
      mapX = nx; mapY = ny;
      if (player.x < 0) player.x = W - player.size;
      if (player.x + player.size > W) player.x = 0;
      if (player.y < 0) player.y = H - player.size;
      if (player.y + player.size > H) player.y = 0;
    } else {
      player.x = Math.max(0, Math.min(player.x, W - player.size));
      player.y = Math.max(0, Math.min(player.y, H - player.size));
    }
  }

  findInteractableObject();
  syncPlayingAudiosWithActiveObjects();

  for(const uniqueKey in playingAudios){
    const entry = playingAudios[uniqueKey];
    const obj = entry.obj;
    if(!obj) continue;
    const objCenterX = obj.x + obj.w/2;
    const objCenterY = obj.y + obj.h/2;
    const dx = (player.x + player.size/2) - objCenterX;
    const dy = (player.y + player.size/2) - objCenterY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const falloff = Math.max(0, 1 - (dist / RADIO_MAX_DIST));
    const vol = falloff * parseFloat(bgmVolume.value || 0.6);
    try{ entry.audio.volume = vol; }catch(e){}
  }

  for(const uniqueKey in playingAudios){
    if(Math.random() < 0.008){
      const parsed = parseUniqueKey(uniqueKey);
      if(!maps[parsed.mapKey]) continue;
      const obj = maps[parsed.mapKey].objects[parsed.index];
      if(!obj) continue;
      spawnNoteForObject(uniqueKey, obj);
    }
  }

  for(const k in objectNotes){
    const arr = objectNotes[k];
    for(let i=arr.length-1;i>=0;i--){
      arr[i].alpha -= 0.01;
      arr[i].x += arr[i].vx;
      arr[i].y += arr[i].dy;
      if(arr[i].alpha <= 0) arr.splice(i,1);
    }
  }

  if (playerName) sendPosition();
  checkBgmZone();
  checkUiZone();

  // global event progress
  updateGlobalEventProgress();
  drawEventCountdown();

  // night/sunrise update
  updateNightAndSunrise();
}

/* --- getImage --- */
function getImage(p){ if(p.crouch) return sprites.crouch[p.dir]; if(p.moving) return sprites.walk[p.dir]; return sprites.idle[p.dir]; }

/* --- 描画 --- */
function formatTimeSec(sec){
  if(!isFinite(sec) || isNaN(sec)) return '--:--';
  const s = Math.max(0, Math.floor(sec));
  const mm = Math.floor(s/60).toString().padStart(2,'0');
  const ss = (s%60).toString().padStart(2,'0');
  return `${mm}:${ss}`;
}

function draw(){
  const key = `${mapX},${mapY}`; const map = maps[key];
  if(status[`bg_${key}`]==='loaded'){ ctx.drawImage(images[`bg_${key}`],0,0,W,H); }else{ ctx.fillStyle='#333'; ctx.fillRect(0,0,W,H); }

  if(map && map.objects){
    map.objects.forEach((o,i)=>{
      if (o.mask) return;
      if (o.img && status[`obj_${key}_${i}`] === 'loaded') {
        ctx.drawImage(images[`obj_${key}_${i}`], o.x, o.y, o.w, o.h);
      } else if (o.type === 'radio') {
        ctx.fillStyle = 'rgba(180,180,255,0.9)';
        ctx.fillRect(o.x, o.y, o.w, o.h);
      }
    });
  }

  // Global event video drawn first (so it appears under avatars as requested)
  const avatarFadeP = getAvatarFadeProgress(); // 0..1
  if(globalEventState.active && globalEventState.video && globalEventState.video.readyState >= 2){
    try{
      ctx.drawImage(globalEventState.video, 0, 0, W, H);
    }catch(e){
      // ignore cross-origin failures
    }
  }

  // draw other players
  for(const id in otherPlayers){
    const p = otherPlayers[id];
    if(p.mapX===mapX && p.mapY===mapY){
      if(globalEventState.active){
        const fadeHeight = avatarFadeP * H;
        const visibleTop = Math.max(0, H - fadeHeight);
        ctx.save();
        ctx.beginPath();
        ctx.rect(0,0,W,visibleTop);
        ctx.clip();
      }
      const img = getImage(p);
      if(p.sitting && p.sitting.sitImg){
        const sitImg = new Image(); sitImg.crossOrigin='anonymous'; sitImg.src = p.sitting.sitImg;
        try{ ctx.drawImage(sitImg, p.x, p.y, player.size, player.size); }catch(e){}
      } else {
        if(img) ctx.drawImage(img,p.x,p.y,player.size,player.size);
      }
      ctx.fillStyle='#fff'; ctx.font='12px sans-serif'; ctx.fillText(p.name||id,p.x,p.y-5);
      if(globalEventState.active) ctx.restore();
    }
  }

  // draw player
  if(!player.hidden){
    if(globalEventState.active){
      const fadeHeight = avatarFadeP * H;
      const visibleTop = Math.max(0, H - fadeHeight);
      ctx.save();
      ctx.beginPath();
      ctx.rect(0,0,W,visibleTop);
      ctx.clip();
    }

    if(player.sitting && player.sitting.sitImg){
      const sitImg = new Image(); sitImg.crossOrigin='anonymous'; sitImg.src = player.sitting.sitImg;
      try{ ctx.drawImage(sitImg, player.x, player.y, player.size, player.size); }catch(e){}
    } else {
      const img = getImage(player);
      if(img) ctx.drawImage(img,player.x,player.y,player.size,player.size);
    }
    ctx.fillStyle='#fff'; ctx.font='16px sans-serif';
    if(playerName) ctx.fillText(playerName,player.x,player.y-5);

    if(globalEventState.active) ctx.restore();
  }

  // notes
  for(const uniqueKey in objectNotes){
    const parsed = parseUniqueKey(uniqueKey);
    if(!maps[parsed.mapKey]) continue;
    const obj = maps[parsed.mapKey].objects[parsed.index];
    if(!obj) continue;
    const arr = objectNotes[uniqueKey];
    for(const n of arr){
      ctx.globalAlpha = n.alpha;
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = '14px sans-serif';
      ctx.fillText('♪', n.x, n.y);
      ctx.globalAlpha = 1;
    }
  }

  // HUD: map name and clock
  ctx.fillStyle='#fff'; ctx.font='16px sans-serif'; ctx.fillText(map.name,10,20);
  const now = new Date();
  ctx.font='20px monospace';
  ctx.fillText(`${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`, W-110,24);

  // join notifications
  const t = Date.now();
  for(let i=joinNotifications.length-1;i>=0;i--){
    if(t-joinNotifications[i].time>3000){ joinNotifications.splice(i,1); } else { ctx.fillStyle='yellow'; ctx.font='16px sans-serif'; ctx.fillText(`${joinNotifications[i].name}さんが出撃`,10,35); }
  }

  // active chats
  for(let i=activeChats.length-1;i>=0;i--){
    const c = activeChats[i];
    if(t-c.time>15000){ activeChats.splice(i,1); continue; }
    const x = c.userId===userId ? player.x : otherPlayers[c.userId]?.x || 0;
    const y = c.userId===userId ? player.y-20 : (otherPlayers[c.userId]?.y-20 || 0);
    ctx.font='14px sans-serif';
    const w = ctx.measureText(c.msg).width;
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.fillRect(x-4,y-20,w+8,20);
    ctx.fillStyle='black';
    ctx.fillText(c.msg,x,y-5);
  }

  // interact prompt (small)
  const SHOW_DURATION = 3000;
  if(currentInteract && (Date.now() - lastInteractDisplayTime) <= SHOW_DURATION){
    const obj = currentInteract.obj;
    const text = obj.interactText || (obj.type==='seat' ? 'E: 座る' : 'E: 使用');
    const smallFont = '6px sans-serif';
    ctx.font = smallFont;
    const textWidth = ctx.measureText(text).width;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(player.x - 6, player.y - 34, textWidth + 12, 14);
    ctx.fillStyle = '#fff';
    ctx.fillText(text, player.x + 0, player.y - 24);
  }

  // drawing global event white overlay if needed
  if(globalEventState.active){
    const whiteP = getWhiteFadeProgress(); // 0..1
    if(whiteP > 0){
      ctx.fillStyle = `rgba(255,255,255,${whiteP})`;
      ctx.fillRect(0,0,W,H);
    }
  }

  // apply night filter overlay (covers everything)
  if(nightFilterAlpha > 0){
    ctx.fillStyle = `rgba(0,20,40,${nightFilterAlpha})`;
    ctx.fillRect(0,0,W,H);
  }

  // draw sunrise effect if preB
  drawSunriseEffect();

  // update DOM countdown for event
  if(globalEventState.active){
    drawEventCountdown();
    countdownElem.style.display = 'block';
  } else {
    countdownElem.style.display = 'none';
  }
}

/* --- メインループ --- */
function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();

window.addEventListener('beforeunload', ()=>{ remove(ref(db,'players/'+userId)); });

</script>
