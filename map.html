<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ユメっ子探せ</title>
<style>
body {
  margin: 0;
  background: #222;
  color: #fff;
  font-family: sans-serif;
  overflow: hidden;
  position: relative;
  height: 100vh;
}
canvas {
  background: #000;
  border: 4px solid #fff;

  width: 400px;   /* 内部解像度基準 */
  height: 300px;
  display: block;
}
#nameForm, #chatForm { display: flex; gap: 5px; margin-bottom: 5px; position: absolute; z-index: 10; }
#nameForm input, #chatForm input { padding: 5px; font-size: 16px; }
#chatForm input { flex: 1; }
#touchControls { position: absolute; bottom: 10px; display: flex; gap: 10px; z-index: 10; }
.touchButton {
  width: 60px; height: 60px;
  background: rgba(255,255,255,0.3); color: #fff;
  font-size: 24px; display: flex;
  align-items: center; justify-content: center;
  border-radius: 10px; user-select: none; touch-action: none;
}
#extraButtons { position: absolute; bottom: 80px; display:flex; gap:10px; z-index: 10; }
#extraButtons .touchButton { background: rgba(0,200,255,0.4); }
</style>
</head>
<body>

<form id="nameForm">
  <input type="text" id="playerName" placeholder="名前を入力" maxlength="10">
  <button type="submit">決定</button>
</form>

<form id="chatForm" style="top: 10px; left: 10px;">
  <input type="text" id="chatInput" placeholder="チャットを入力" maxlength="50">
  <button type="submit">送信</button>
</form>

<canvas id="game" width="400" height="300"></canvas>

<div id="touchControls" style="display:none;">
  <div class="touchButton" data-key="w">↑</div>
  <div class="touchButton" data-key="s">↓</div>
  <div class="touchButton" data-key="a">←</div>
  <div class="touchButton" data-key="d">→</div>
</div>

<div id="extraButtons" style="display:none;">
  <div class="touchButton" data-key="shift">Shift</div>
  <div class="touchButton" data-key="space">Space</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getDatabase, ref, set, onValue, remove, onChildAdded, push, get, onChildRemoved } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

// ====================== Firebase 設定 ======================
const firebaseConfig = {
  apiKey: "AIzaSyAXO76mF3C0TQAHkFsFUqDsI6JXOqGgMlw",
  authDomain: "zzonline.firebaseapp.com",
  databaseURL: "https://zzonline-default-rtdb.firebaseio.com",
  projectId: "zzonline",
  storageBucket: "zzonline.firebasestorage.app",
  messagingSenderId: "50179905692",
  appId: "1:50179905692:web:12b9664ac730e6a58d3559",
  measurementId: "G-NMVHG2XN1F"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ====================== ユーザーID ======================
let userId = sessionStorage.getItem('userId');
if(!userId){
  userId = 'user_' + Date.now() + '_' + Math.floor(Math.random()*1000);
  sessionStorage.setItem('userId', userId);
}

// ====================== 名前取得 ======================
let playerName = localStorage.getItem('playerName') || '';
const nameForm = document.getElementById('nameForm');
const nameInput = document.getElementById('playerName');
if(playerName) nameForm.style.display='none';

nameForm.addEventListener('submit', async (e)=>{
  e.preventDefault();
  if(nameInput.value.trim()==='') return;
  playerName = nameInput.value.trim();
  localStorage.setItem('playerName', playerName);
  nameForm.style.display='none';

  // 同じ名前のユーザーを削除
  const playersSnapshot = await get(ref(db,'players'));
  const playersData = playersSnapshot.val() || {};
  for(const id in playersData){
    if(playersData[id].name === playerName && id !== userId){
      remove(ref(db,'players/'+id));
    }
  }

  // 自分のデータを登録
  sendPosition();
  sessionStorage.setItem('enterTime', Date.now());
});

// ====================== Canvas 設定 ======================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ====================== リサイズ対応 ======================
function resizeCanvas(){
  const scaleX = window.innerWidth / W;
  const scaleY = window.innerHeight / H;
  const scale = Math.min(scaleX, scaleY);

  canvas.style.transform = `scale(${scale})`;
  canvas.style.transformOrigin = 'top left';

  canvas.style.left = `${(window.innerWidth - W*scale)/2}px`;
  canvas.style.top  = `${(window.innerHeight - H*scale)/2}px`;
  canvas.style.position = 'absolute';
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ====================== プレイヤー ======================
const player = { x:80, y:30, size:24, speed:1.2, img:new Image(), imgLoaded:false, hidden:false, shift:false };
player.img.src = 'https://picsum.photos/seed/player/48';
player.img.onload = ()=>player.imgLoaded = true;
const playerShiftImg = new Image();
playerShiftImg.src = 'https://picsum.photos/seed/playerShift/48';

// 他プレイヤー
const otherPlayers = {};
const otherImages = {};

// ====================== マップ ======================
const maps = {
  '0,0': { name:'スタート', bg:'https://picsum.photos/id/1015/400/300', block:{up:false,down:false,left:false,right:false}, objects:[
    {type:'block',x:150,y:80,w:64,h:64,img:'https://picsum.photos/id/1056/64/64'},
    {type:'event',x:60,y:200,w:80,h:40,img:null,event:'A'},
    {type:'warp',x:200,y:200,w:40,h:40,img:'https://picsum.photos/id/1025/40/40',to:{x:0,y:0}}
  ] },
  '1,0':{ name:'右の森', bg:'https://picsum.photos/id/1020/400/300', block:{up:false,down:true,left:false,right:true}, objects:[
    {type:'block',x:220,y:120,w:64,h:64,img:'https://picsum.photos/id/1062/64/64'}
  ] },
  '-1,0':{ name:'左の森', bg:'https://picsum.photos/id/1016/400/300', block:{up:false,down:false,left:false,right:false}, objects:[
    {type:'block',x:150,y:80,w:64,h:64,img:'https://picsum.photos/id/1056/64/64'},
    {type:'grass',x:60,y:200,w:80,h:40,img:null,event:'A'}
  ] }
};

const images = {};
const status = {};
function loadImage(key,src){
  const img = new Image();
  status[key] = 'loading';
  img.onload = ()=>status[key]='loaded';
  img.onerror = ()=>status[key]='error';
  img.src = src;
  images[key] = img;
}
for(const k in maps){
  loadImage(`bg_${k}`, maps[k].bg);
  maps[k].objects.forEach((o,i)=>{ if(o.img) loadImage(`obj_${k}_${i}`, o.img); });
}

// ====================== 入力管理 ======================
const keyState={};
addEventListener('keydown', e=>{
  keyState[e.key.toLowerCase()]=true;
  if(e.key==='Shift') player.shift=true;
  if(e.key===' ' || e.key==='Space'){ triggerSpaceEvent(); }
});
addEventListener('keyup', e=>{
  keyState[e.key.toLowerCase()]=false;
  if(e.key==='Shift') player.shift=false;
});

// ====================== スマホ操作ボタン ======================
const touchControls = document.getElementById('touchControls');
const extraButtons = document.getElementById('extraButtons');
const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
if(isMobile){
  touchControls.style.display='flex';
  extraButtons.style.display='flex';
}
document.querySelectorAll('.touchButton').forEach(btn=>{
  const key = btn.dataset.key;
  btn.addEventListener('touchstart', e=>{ e.preventDefault(); if(key==='shift') player.shift=true; else if(key==='space') triggerSpaceEvent(); else keyState[key]=true; });
  btn.addEventListener('touchend', e=>{ e.preventDefault(); if(key==='shift') player.shift=false; else keyState[key]=false; });
});

// ====================== 判定 ======================
function hit(a,b){ return a.x<b.x+b.w && a.x+a.size>b.x && a.y<b.y+b.h && a.y+a.size>b.y; }
function isOnGrass(){
  const key = `${mapX},${mapY}`;
  const map = maps[key];
  for(const obj of map.objects){
    if(obj.type==='grass' && hit(player,obj)) return true;
  }
  return false;
}

// ====================== 草イベント ======================
function triggerSpaceEvent(){
  if(isOnGrass()){
    const chatSound = new Audio('https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/chat.mp3');
    chatSound.play();
    if(Math.random() < 1/20){ // 動画イベント
      player.hidden=true;
      remove(ref(db,'players/'+userId));
      localStorage.setItem('playVideo','true');
      location.href='index.html';
    }
  }
}

// ====================== マップ状態 ======================
let mapX=0, mapY=0;

// ====================== Firebase送信 ======================
function sendPosition(){
  if(player.hidden) return;
  const playerRef=ref(db,'players/'+userId);
  set(playerRef,{
    x:player.x,
    y:player.y,
    mapX:mapX,
    mapY:mapY,
    name:playerName,
    imgUrl: player.shift ? playerShiftImg.src : player.img.src,
    shift: player.shift,
    timestamp:Date.now()
  });
}

// ====================== 他プレイヤー取得 ======================
const playersRef = ref(db,'players');
onValue(playersRef,(snapshot)=>{
  const data = snapshot.val()||{};
  for(const id in data){
    if(id!==userId){
      otherPlayers[id]=data[id];
      if(!otherImages[id]){
        const img = new Image();
        img.src = data[id].imgUrl || 'https://picsum.photos/seed/player/48';
        otherImages[id] = { img, loaded:false };
        img.onload = ()=>otherImages[id].loaded=true;
      }
      else otherImages[id].img.src = data[id].imgUrl; // Shift共有反映
    }
  }
});

// 他プレイヤー削除反映
onChildRemoved(playersRef, snapshot=>{
  const id = snapshot.key;
  delete otherPlayers[id];
  delete otherImages[id];
});

// ====================== 入室通知 ======================
const joinNotifications = [];
const notifiedUsers = new Set();
const chime = new Audio('https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/Chime.mp3');
const enterTime = Date.now();
onChildAdded(playersRef, snapshot => {
  const data = snapshot.val();
  const id = snapshot.key;
  if(id!==userId && !notifiedUsers.has(id)){
    notifiedUsers.add(id);
    if(Date.now()-enterTime>5000){ chime.currentTime=0; chime.play(); joinNotifications.push({ name:data.name||'名無し', time: Date.now() }); }
  }
});

// ====================== チャット ======================
const chatForm = document.getElementById('chatForm');
const chatInput = document.getElementById('chatInput');
const chatsRef = ref(db,'chats');
let activeChats = [];

chatForm.addEventListener('submit',(e)=>{
  e.preventDefault();
  const msg = chatInput.value.trim();
  if(!msg) return;
  chatInput.value='';
  const chatData = { userId, name:playerName, msg, mapX, mapY, timestamp:Date.now() };
  push(chatsRef, chatData);
});

onChildAdded(chatsRef, snapshot=>{
  const chat = snapshot.val();
  if(chat.mapX===mapX && chat.mapY===mapY){
    if(Date.now()-enterTime<5000) return; // 入室5秒間無効
    activeChats = activeChats.filter(c=>!(c.userId===chat.userId));
    activeChats.push({...chat, time:Date.now()});
    const chatSound = new Audio('https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/chat.mp3');
    chatSound.play();
  }
});

// ====================== 古いプレイヤー・チャット自動削除 ======================
setInterval(async ()=>{
  const now = Date.now();

  // プレイヤー削除（5分無操作）
  const playersSnap = await get(ref(db,'players'));
  const playersData = playersSnap.val() || {};
  for(const id in playersData){
    if(now - playersData[id].timestamp > 300000){ // 5分
      remove(ref(db,'players/'+id));
    }
  }

  // 古いチャット削除（15分以上）
  const chatsSnap = await get(ref(db,'chats'));
  const chatsData = chatsSnap.val() || {};
  for(const chatId in chatsData){
    if(now - chatsData[chatId].timestamp > 900000){ // 15分
      remove(ref(db,'chats/'+chatId));
    }
  }
},60000);

// ====================== 更新 ======================
function update(){
  const key = `${mapX},${mapY}`;
  if(!maps[key]) return;
  const map = maps[key];
  const ox=player.x, oy=player.y;

  if(keyState.w) player.y-=player.speed;
  if(keyState.s) player.y+=player.speed;
  if(keyState.a) player.x-=player.speed;
  if(keyState.d) player.x+=player.speed;

  for(const obj of map.objects){
    if(hit(player,obj)){
      if(obj.type==='block'){ player.x=ox; player.y=oy; }
      if(obj.type==='warp'){ // ワープ判定
        player.x = obj.to.x;
        player.y = obj.to.y;
        mapX = 0; mapY = 0;
      }
    }
  }

  let nextMapX = mapX, nextMapY = mapY;
  if(player.x<0) nextMapX--; 
  if(player.x+player.size>W) nextMapX++; 
  if(player.y<0) nextMapY--; 
  if(player.y+player.size>H) nextMapY++; 
  if(maps[`${nextMapX},${nextMapY}`]){
    mapX=nextMapX; mapY=nextMapY;
    if(player.x<0) player.x=W-player.size;
    if(player.x+player.size>W) player.x=0;
    if(player.y<0) player.y=H-player.size;
    if(player.y+player.size>H) player.y=0;
  } else { player.x=ox; player.y=oy; }

  if(playerName) sendPosition();
}

// ====================== 描画 ======================
function draw(){
  const key = `${mapX},${mapY}`;
  const map = maps[key];
  if(status[`bg_${key}`]==='loaded') ctx.drawImage(images[`bg_${key}`],0,0,W,H);
  else ctx.fillStyle='#333', ctx.fillRect(0,0,W,H);

  map.objects.forEach((o,i)=>{
    if(o.img && status[`obj_${key}_${i}`]==='loaded') ctx.drawImage(images[`obj_${key}_${i}`],o.x,o.y,o.w,o.h);
  });

  for(const id in otherPlayers){
    const p = otherPlayers[id];
    if(p.mapX===mapX && p.mapY===mapY){
      const oi = otherImages[id];
      if(oi.loaded) ctx.drawImage(oi.img, p.x, p.y, player.size, player.size);
      else ctx.fillStyle='#0f0', ctx.fillRect(p.x,p.y,player.size,player.size);
      ctx.fillStyle='#fff';
      ctx.font='12px sans-serif';
      ctx.fillText(p.name||id, p.x, p.y-5);
    }
  }

  if(!player.hidden){
    const imgToDraw = player.shift ? playerShiftImg : player.img;
    if(player.imgLoaded) ctx.drawImage(imgToDraw,player.x,player.y,player.size,player.size);
    else ctx.fillStyle='#f55', ctx.fillRect(player.x,player.y,player.size,player.size);
    if(playerName) ctx.fillStyle='#fff', ctx.font='16px sans-serif', ctx.fillText(playerName, player.x, player.y-5);
  }

  ctx.fillStyle='#fff'; ctx.font='16px sans-serif'; ctx.fillText(map.name,10,20);
  const now = new Date();
  ctx.fillStyle='#fff'; ctx.font='20px monospace';
  ctx.fillText(`${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`,W-110,24);

  const nowTime = Date.now();
  for(let i=joinNotifications.length-1;i>=0;i--){
    const n = joinNotifications[i];
    if(nowTime - n.time > 3000){ joinNotifications.splice(i,1); continue; }
    ctx.fillStyle='yellow'; ctx.font='16px sans-serif';
    ctx.fillText(`${n.name}さんが出撃`,10,35);
  }

  for(let i=activeChats.length-1;i>=0;i--){
    const c = activeChats[i];
    if(nowTime - c.time > 15000){ activeChats.splice(i,1); continue; }
    const x = c.userId===userId ? player.x : otherPlayers[c.userId]?.x || 0;
    const y = c.userId===userId ? player.y - 20 : (otherPlayers[c.userId]?.y - 20 || 0);
    ctx.font='14px sans-serif';
    const padding = 4;
    const textWidth = ctx.measureText(c.msg).width;
    const textHeight = 16;
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.fillRect(x - padding, y - textHeight - padding, textWidth + padding*2, textHeight + padding*2);
    ctx.fillStyle='black';
    ctx.fillText(c.msg, x, y);
  }
}

// ====================== メインループ ======================
function loop(){ update(); draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);

window.addEventListener('beforeunload', ()=>{ remove(ref(db,'players/'+userId)); });

</script>
</body>
</html>
