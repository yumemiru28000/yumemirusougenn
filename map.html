function resizeCanvas(){
  const scaleX = window.innerWidth / W;
  const scaleY = window.innerHeight / H;
  const scale = Math.min(scaleX, scaleY);
  canvas.style.transform = `scale(${scale})`;
  canvas.style.transformOrigin = 'top left';
  canvas.style.left = `${(window.innerWidth - W*scale)/2}px`;
  canvas.style.top  = `${(window.innerHeight - H*scale)/2}px`;
  canvas.style.position = 'absolute';
}

// アルバム管理
let albumList = [];
let albumIndex = 0;
let albumActive = false;


  

function playSingleBgm(url){
  if(singleBgmAudio.src !== url){
    singleBgmAudio.src = url;
    singleBgmAudio.play();
  }
}

function stopSingleBgm(){
  singleBgmAudio.pause();
  singleBgmAudio.currentTime = 0;
}

function playAlbum(list){
  if(albumActive && JSON.stringify(albumList) === JSON.stringify(list)) return;

  albumList = list;
  albumIndex = 0;
  albumActive = true;

  albumBgmAudio.src = albumList[albumIndex];
  albumBgmAudio.play();

  albumBgmAudio.onended = ()=>{
    if(!albumActive) return;
    albumIndex = (albumIndex + 1) % albumList.length;
    albumBgmAudio.src = albumList[albumIndex];
    albumBgmAudio.play();
  };
}

function stopAlbum(){
  albumActive = false;
  albumBgmAudio.pause();
  albumBgmAudio.currentTime = 0;
}


  
  
function checkBgmZone(){
  let singleHit = null;
  let albumHit = null;

  for(const zone of worldBgmZones){
    if(
      mapX >= zone.mapX1 &&
      mapX <= zone.mapX2 &&
      mapY >= zone.mapY1 &&
      mapY <= zone.mapY2
    ){
      if(zone.type === 'single') singleHit = zone;
      if(zone.type === 'album') albumHit = zone;
    }
  }

  // 単体BGM
  if(singleHit){
    playSingleBgm(singleHit.url);
  }else{
    stopSingleBgm();
  }

  // アルバムBGM
  if(albumHit){
    playAlbum(albumHit.list);
  }else{
    stopAlbum();
  }
}

function isPassable(x, y, image) {
  const img = new Image();
  img.src = image;
  img.onload = function () {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img, 0, 0);
    
    // 画像のピクセル情報を取得
    const pixelData = ctx.getImageData(x, y, 1, 1).data; // 1x1ピクセルのデータを取得

    // アルファチャンネルが0（透明）でない場合、通れない
    return pixelData[3] === 0 ? false : true;
  };
} 
  function checkObjectCollision(player) {

      const objWidth = obj.w;
      const objHeight = obj.h;

      //☆ PNG画像内の通過判定
      if (isPassable(player.x, player.y, obj.img)) {
        // 通れない場合
        player.x = ox;
        player.y = oy;
      }
    }
  }
}

function hit(a,b){
  return a.x<b.x+b.w && a.x+a.size>b.x && a.y<b.y+b.h && a.y+a.size>b.y;
}

let mapX = SPAWN.mapX;

function isOnGrass(){
  const key = `${mapX},${mapY}`;
  const map = maps[key];
  for(const obj of map.objects){
    if(obj.type==='grass' && hit(player,obj)) return true;
  }
  return false;
}

function triggerSpaceEvent(){
  if(isOnGrass()){
    const chatSound = new Audio('https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/kusa.mp3');

    if(Math.random()<1/20){

      remove(ref(db,'players/'+userId));

    }
  }
}

const zoneImage = document.getElementById('zoneImage');
const zoneText  = document.getElementById('zoneText');

function checkUiZone(){
  let hit = null;

  for(const zone of worldUiZones){
    if(
      mapX >= zone.mapX1 &&
      mapX <= zone.mapX2 &&
      mapY >= zone.mapY1 &&
      mapY <= zone.mapY2
    ){
      hit = zone;
      break;
    }
  }

  if(hit){
    zoneImage.src = hit.image;
    zoneImage.style.display = 'block';
    zoneText.textContent = hit.text;
  }else{
    zoneImage.style.display = 'none';
    zoneText.textContent = '';
  }
}

function update() {
    const key = mapX + ',' + mapY; // `${mapX},${mapY}` の代わりに文字列結合
    if (!maps[key]) return;
    const map = maps[key];

    const ox = player.x;
    const oy = player.y;

    player.moving = false;
    player.crouch = player.shift;

    if (keyState.w) { player.y -= player.speed; player.dir = 'up'; player.moving = true; }
    if (keyState.s) { player.y += player.speed; player.dir = 'down'; player.moving = true; }
    if (keyState.a) { player.x -= player.speed; player.dir = 'left'; player.moving = true; }
    if (keyState.d) { player.x += player.speed; player.dir = 'right'; player.moving = true; }

    for (const obj of map.objects) {
        if (obj.type === 'gate') {
            const need = countPlayersInRange(obj);
            const near = playersNearGate(obj);
            if (near >= need) {
                // 全員TP
                for (const id in otherPlayers) {
                    const p = otherPlayers[id];
                    if (
                        p.mapX >= obj.range.mapX1 && p.mapX <= obj.range.mapX2 &&
                        p.mapY >= obj.range.mapY1 && p.mapY <= obj.range.mapY2
                    ) {
                        set(ref(db, 'players/' + id), {
                            ...p,
                            mapX: obj.to.mapX,
                            mapY: obj.to.mapY,
                            x: obj.to.x,
                            y: obj.to.y,
                            timestamp: Date.now()
                        });
                    }
                }
                mapX = obj.to.mapX;
                mapY = obj.to.mapY;
                player.x = obj.to.x;
                player.y = obj.to.y;
            } else if (near > 0) {
                gateMessage = '残り' + (need - near) + '人';
                gatePos = { x: obj.x, y: obj.y };
            }
        }
    }

    for (const obj of map.objects) {
        if (hit(player, obj)) {
            if (obj.type === 'block') {
                player.x = ox;
                player.y = oy;
            }
            if (obj.type === 'warp') {
                player.x = obj.to.x;
                player.y = obj.to.y;
                mapX = obj.to.mapX;
                mapY = obj.to.mapY;
            }
        }
    }

    let nx = mapX, ny = mapY;
    if (player.x < 0) nx--;
    if (player.x + player.size > W) nx++;
    if (player.y < 0) ny--;
    if (player.y + player.size > H) ny++;

    if (maps[nx + ',' + ny]) {
        mapX = nx;
        mapY = ny;
        if (player.x < 0) player.x = W - player.size;
        if (player.x + player.size > W) player.x = 0;
        if (player.y < 0) player.y = H - player.size;
        if (player.y + player.size > H) player.y = 0;
    } else {
        player.x = ox;
        player.y = oy;
    }

    if (playerName) sendPosition();
    checkBgmZone();
    checkUiZone();
}





function getImage(p){
  if(p.crouch) return sprites.crouch[p.dir];
  if(p.moving) return sprites.walk[p.dir];
  return sprites.idle[p.dir];
}

function draw(){
  const key = `${mapX},${mapY}`;
  const map = maps[key];

  if(status[`bg_${key}`]==='loaded'){
    ctx.drawImage(images[`bg_${key}`],0,0,W,H);
  }else{
    ctx.fillStyle='#333';
    ctx.fillRect(0,0,W,H);
  }

  //☆ マップ画像の下にPNGオブジェクトを隠すための透明描画
  map.objects.forEach((obj, i) => {
    if (obj.type === 'block' && status[`obj_${key}_${i}`] === 'loaded') {
      ctx.drawImage(images[`obj_${key}_${i}`], obj.x, obj.y, obj.w, obj.h);
    }
  });

  for(const id in otherPlayers){
    const p = otherPlayers[id];
    if(p.mapX===mapX && p.mapY===mapY){
      const img = getImage(p);
      if(img) ctx.drawImage(img,p.x,p.y,player.size,player.size);
      ctx.fillStyle='#fff';
      ctx.font='12px sans-serif';
      ctx.fillText(p.name||id,p.x,p.y-5);
    }
  }
  //☆ 追加したnewPNGObject（新しいPNG画像）を描画（マップの下に隠す）
  if (status[`obj_${key}_newPNG`] === 'loaded') {
    ctx.drawImage(images[`obj_${key}_newPNG`], 0, 0, 400, 300); // マップ画像の下に隠して描画
  }
  if(!player.hidden){
    const img = getImage(player);
    if(img) ctx.drawImage(img,player.x,player.y,player.size,player.size);
    ctx.fillStyle='#fff';
    ctx.font='16px sans-serif';
    if(playerName) ctx.fillText(playerName,player.x,player.y-5);
  }

  ctx.fillStyle='#fff';
  ctx.font='16px sans-serif';
  ctx.fillText(map.name,10,20);

  const now = new Date();
  ctx.font='20px monospace';
  ctx.fillText(
    `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`,
    W-110,24
  );

  const t = Date.now();
  for(let i=joinNotifications.length-1;i>=0;i--){
    if(t-joinNotifications[i].time>3000){
      joinNotifications.splice(i,1);
    }else{
      ctx.fillStyle='yellow';
      ctx.font='16px sans-serif';
      ctx.fillText(`${joinNotifications[i].name}さんが出撃`,10,35);
    }
  }

  for(let i=activeChats.length-1;i>=0;i--){
    const c = activeChats[i];
    if(t-c.time>15000){
      activeChats.splice(i,1);
      continue;
    }
    const x = c.userId===userId ? player.x : otherPlayers[c.userId]?.x || 0;
    const y = c.userId===userId ? player.y-20 : (otherPlayers[c.userId]?.y-20 || 0);
    ctx.font='14px sans-serif';
    const w = ctx.measureText(c.msg).width;
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.fillRect(x-4,y-20,w+8,20);
    ctx.fillStyle='black';
    ctx.fillText(c.msg,x,y-5);
  }

  //☆ 画像読み込み
function loadImage(key, src) {
  const img = new Image();
  status[key] = 'loading';
  img.onload = () => status[key] = 'loaded';
  img.onerror = () => status[key] = 'error';
  img.src = src;
  images[key] = img;
}
// 画像をマップと新しいPNGオブジェクトの両方に読み込む
for (const k in maps) {
  loadImage(`bg_${k}`, maps[k].bg);
  maps[k].objects.forEach((o, i) => {
    if (o.img) loadImage(`obj_${k}_${i}`, o.img);
  });
  loadImage(`obj_${k}_newPNG`, newPNGObject.img); //☆ 新しいPNGオブジェクトの画像も読み込む
}
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

window.addEventListener('beforeunload',()=>{
  remove(ref(db,'players/'+userId));
});
