<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ユメっ子探せ</title>
<style>
  body {
    margin: 0;
    background: #222;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    color: #fff;
    font-family: sans-serif;
  }
  canvas {
    background: #000;
    border: 4px solid #fff;
  }
  #nameForm {
    margin-bottom: 10px;
  }
  #nameForm input {
    padding: 5px;
    font-size: 16px;
  }
</style>
</head>
<body>

<form id="nameForm">
  <input type="text" id="playerName" placeholder="名前を入力" maxlength="10">
  <button type="submit">決定</button>
</form>

<canvas id="game" width="400" height="300"></canvas>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

// ====================== Firebase 設定 ======================
const firebaseConfig = {
  apiKey: "AIzaSyAXO76mF3C0TQAHkFsFUqDsI6JXOqGgMlw",
  authDomain: "zzonline.firebaseapp.com",
  databaseURL: "https://zzonline-default-rtdb.firebaseio.com",
  projectId: "zzonline",
  storageBucket: "zzonline.firebasestorage.app",
  messagingSenderId: "50179905692",
  appId: "1:50179905692:web:12b9664ac730e6a58d3559",
  measurementId: "G-NMVHG2XN1F"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// ====================== ユーザーID（同一PC内で共有） ======================
let userId = localStorage.getItem('userId');
if(!userId){
  userId = 'user_' + Date.now() + '_' + Math.floor(Math.random()*1000);
  localStorage.setItem('userId', userId);
}

// ====================== 名前取得 ======================
let playerName = localStorage.getItem('playerName') || '';
const nameForm = document.getElementById('nameForm');
const nameInput = document.getElementById('playerName');
if(playerName) nameForm.style.display='none';

nameForm.addEventListener('submit', (e)=>{
  e.preventDefault();
  if(nameInput.value.trim()==='') return;
  playerName = nameInput.value.trim();
  localStorage.setItem('playerName', playerName);
  nameForm.style.display='none';
});

// ====================== Canvas 設定 ======================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ====================== プレイヤー ======================
const player = { x:80, y:30, size:24, speed:1.2, img:new Image(), imgLoaded:false };
player.img.src = 'https://picsum.photos/seed/player/48';
player.img.onload = ()=>player.imgLoaded = true;

// 他プレイヤー
const otherPlayers = {};
const otherImages = {};

// ====================== マップ ======================
const maps = {
  '0,0': { name:'スタート', bg:'https://picsum.photos/id/1015/400/300', block:{up:false,down:false,left:false,right:false}, objects:[{type:'block',x:150,y:80,w:64,h:64,img:'https://picsum.photos/id/1056/64/64'}, {type:'event',x:60,y:200,w:80,h:40,img:null,event:'A'}] },
  '1,0': { name:'右の森', bg:'https://picsum.photos/id/1020/400/300', block:{up:false,down:true,left:false,right:true}, objects:[{type:'block',x:220,y:120,w:64,h:64,img:'https://picsum.photos/id/1062/64/64'}] },
  '-1,0': { name:'左の森', bg:'https://picsum.photos/id/1016/400/300', block:{up:false,down:false,left:false,right:false}, objects:[{type:'block',x:150,y:80,w:64,h:64,img:'https://picsum.photos/id/1056/64/64'}, {type:'grass',x:60,y:200,w:80,h:40,img:null,event:'A'}] }
};

// 画像ロード
const images = {};
const status = {};
function loadImage(key,src){
  const img = new Image();
  status[key] = 'loading';
  img.onload = ()=>status[key]='loaded';
  img.onerror = ()=>status[key]='error';
  img.src = src;
  images[key] = img;
}
for(const k in maps){
  loadImage(`bg_${k}`, maps[k].bg);
  maps[k].objects.forEach((o,i)=>{ if(o.img) loadImage(`obj_${k}_${i}`, o.img); });
}

// ====================== 入力管理 ======================
const keyState={};
addEventListener('keydown', e=>keyState[e.key.toLowerCase()]=true);
addEventListener('keyup', e=>keyState[e.key.toLowerCase()]=false);

// ====================== 時間制限 ======================
let timeLeft=120;
let lastTime=performance.now();
function formatTime(sec){
  const m=Math.floor(sec/60);
  const s=Math.floor(sec%60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}

// ====================== 判定 ======================
function hit(a,b){ return a.x<b.x+b.w && a.x+a.size>b.x && a.y<b.y+b.h && a.y+a.size>b.y; }

// ====================== イベント ======================
let eventLock=false;
function triggerGrassEventA(){
  if(eventLock) return;
  eventLock=true;
  remove(ref(db,'players/'+userId));
  localStorage.setItem('playVideo','true');
  location.href='index.html';
}

// ====================== マップ状態 ======================
let mapX=0, mapY=0;

// ====================== Firebase送信（heartbeat付き） ======================
function sendPosition(){
  const playerRef=ref(db,'players/'+userId);
  set(playerRef,{
    x:player.x,
    y:player.y,
    mapX:mapX,
    mapY:mapY,
    name:playerName,
    imgUrl:player.img.src,
    lastSeen: Date.now(), // heartbeat
    timestamp:Date.now()
  });
}

// ====================== Firebase 他プレイヤー取得 ======================
const playersRef = ref(db,'players');
onValue(playersRef,(snapshot)=>{
  const data = snapshot.val()||{};
  const now = Date.now();
  for(const id in data){
    const p = data[id];
    // 30秒以上更新がないプレイヤーは削除
    if(now - (p.lastSeen||0) > 30000){
      remove(ref(db,'players/'+id));
      continue;
    }
    if(id!==userId) otherPlayers[id]=p;
  }
});

// ====================== 更新 ======================
function update(){
  const map = maps[`${mapX},${mapY}`];
  const ox=player.x, oy=player.y;
  if(keyState.w) player.y-=player.speed;
  if(keyState.s) player.y+=player.speed;
  if(keyState.a) player.x-=player.speed;
  if(keyState.d) player.x+=player.speed;

  for(const obj of map.objects){
    if(hit(player,obj)){
      if(obj.type==='block'){ player.x=ox; player.y=oy; }
      if(obj.type==='event' && obj.event==='A'){ triggerGrassEventA(); }
      if(obj.type==='grass' && obj.event==='A'){ triggerGrassEventA(); }
    }
  }

  if(player.x<0){ mapX--; player.x=W-player.size; }
  if(player.x+player.size>W){ mapX++; player.x=0; }
  if(player.y<0){ mapY--; player.y=H-player.size; }
  if(player.y+player.size>H){ mapY++; player.y=0; }

  if(playerName) sendPosition();
}

// ====================== 描画 ======================
function draw(){
  const key = `${mapX},${mapY}`;
  if(status[`bg_${key}`]==='loaded') ctx.drawImage(images[`bg_${key}`],0,0,W,H);
  else { ctx.fillStyle='#333'; ctx.fillRect(0,0,W,H); }

  const map = maps[key];
  map.objects.forEach((o,i)=>{ 
    if(o.img && status[`obj_${key}_${i}`]==='loaded') ctx.drawImage(images[`obj_${key}_${i}`],o.x,o.y,o.w,o.h); 
  });

  // 他プレイヤー描画
  for(const id in otherPlayers){
    const p = otherPlayers[id];
    if(p.mapX===mapX && p.mapY===mapY){
      if(!otherImages[id]){
        const img = new Image();
        img.src = p.imgUrl || 'https://picsum.photos/seed/player/48';
        otherImages[id] = { img, loaded:false };
        img.onload = ()=>otherImages[id].loaded=true;
      }
      const oi = otherImages[id];
      if(oi.loaded) ctx.drawImage(oi.img, p.x, p.y, player.size, player.size);
      else { ctx.fillStyle='#0f0'; ctx.fillRect(p.x,p.y,player.size,player.size); }
      ctx.fillStyle='#fff';
      ctx.font='12px sans-serif';
      ctx.fillText(p.name||id, p.x, p.y-5);
    }
  }

  // 自分描画
  if(player.imgLoaded) ctx.drawImage(player.img,player.x,player.y,player.size,player.size);
  else { ctx.fillStyle='#f55'; ctx.fillRect(player.x,player.y,player.size,player.size); }
  ctx.fillStyle='#fff';
  ctx.font='16px sans-serif';
  if(playerName) ctx.fillText(playerName, player.x, player.y-5);

  // マップ名と時間
  ctx.fillStyle='#fff';
  ctx.font='16px sans-serif';
  ctx.fillText(map.name,10,20);
  ctx.font='20px monospace';
  ctx.fillText(formatTime(timeLeft),W-90,24);
}

// ====================== メインループ ======================
function loop(now){
  const dt=(now-lastTime)/1000;
  lastTime=now;
  timeLeft-=dt;
  if(timeLeft<=0){
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';
    ctx.font='24px sans-serif';
    ctx.fillText('TIME UP',W/2-60,H/2);
    return;
  }
  update();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ====================== タブ閉じ・ページ移動時に Firebase 削除 ======================
window.addEventListener('beforeunload', ()=>{
  remove(ref(db,'players/'+userId));
});
</script>
</body>
</html>
