<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ユメっ子探せ</title>
<style>
  body {
    margin: 0;
    background: #222;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
  canvas {
    background: #000;
    border: 4px solid #fff;
  }
</style>
</head>
<body>
<canvas id="game" width="400" height="300"></canvas>
<script>
// ================================
// 基本設定
// ================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

// ================================
// プレイヤー定義
// ================================
const player = {
  x: 80,
  y: 30,
  size: 24,
  speed: 1.2,
  img: (() => {
    const i = new Image();
    i.src = 'https://picsum.photos/seed/player/48';
    return i;
  })()
};

// ================================
// マップ定義
// ================================
const maps = {
  '0,0': {
    name: 'スタート',
    bg: 'https://picsum.photos/id/1015/400/300',
    block: { up:false, down:false, left:false, right:false },
    objects: [
      { type:'block', x:150, y:80,  w:64, h:64, img:'https://picsum.photos/id/1056/64/64' },
      { type:'event', x:60,  y:200, w:80, h:40, img:null, event:'B' }
    ]
  },
  '1,0': {
    name: '右の森',
    bg: 'https://picsum.photos/id/1020/400/300',
    block: { up:false, down:true, left:false, right:true },
    objects: [
      { type:'block', x:220, y:120, w:64, h:64, img:'https://picsum.photos/id/1062/64/64' }
    ]
  },


'-1,0': {
  name: 'スタート',
  bg: 'https://picsum.photos/id/1015/400/300',
  block: { up:false, down:false, left:false, right:false },
  objects: [
    { type:'block', x:150, y:80,  w:64, h:64, img:'https://picsum.photos/id/1056/64/64' },
    // 新規 草ブロック（通過可能・イベントA）
    { type:'grass', x:60, y:200, w:80, h:40, img:null, event:'A' }
  ]
}
};



// ================================
// 画像ロード
// ================================
const images = {};
const status = {};

function loadImage(key, src) {
  const img = new Image();
  status[key] = 'loading';
  img.onload = () => status[key] = 'loaded';
  img.onerror = () => status[key] = 'error';
  img.src = src;
  images[key] = img;
}

for (const k in maps) {
  loadImage(`bg_${k}`, maps[k].bg);
  maps[k].objects.forEach((o,i)=>{
    if (o.img) loadImage(`obj_${k}_${i}`, o.img);
  });
}

// ================================
// 入力管理
// ================================
const keyState = {};
addEventListener('keydown', e => {
  keyState[e.key.toLowerCase()] = true;
});
addEventListener('keyup', e => {
  keyState[e.key.toLowerCase()] = false;
});


// ================================
// 時間制限（2分）
// ================================
let timeLeft = 120;
let lastTime = performance.now();

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}

// ================================
// 判定
// ================================
function hit(a,b){
  return a.x < b.x+b.w && a.x+a.size > b.x && a.y < b.y+b.h && a.y+a.size > b.y;
}

// ================================
// イベント処理
// ================================
function triggerGrassEventA(){
  if (eventLock) return;
  eventLock = true;

  // index.html で動画を再生するフラグ
  localStorage.setItem('playVideo', 'true');

  // map.html から index.html に戻る
  location.href = 'index.html';
}


// ================================
// マップ状態
// ================================
let mapX = 0;
let mapY = 0;

// ================================
// 更新処理
// ================================
function update(){
  const map = maps[`${mapX},${mapY}`];
  const ox = player.x;
  const oy = player.y;

if (keyState.w) player.y -= player.speed;
if (keyState.s) player.y += player.speed;
if (keyState.a) player.x -= player.speed;
if (keyState.d) player.x += player.speed;


  for (const obj of map.objects) {
    if (hit(player,obj)){
      if (obj.type==='block'){
        player.x = ox; player.y = oy;
      }
      if (obj.type==='event' && obj.event==='B'){
        triggerGrassEventA();
      }
if (obj.type==='grass' && obj.event==='A'){ // ←新規
    triggerGrassEventA();
  }
      
    }
  }

  if (player.x < 0) { mapX--; player.x = W-player.size; }
  if (player.x+player.size > W) { mapX++; player.x = 0; }
  if (player.y < 0) { mapY--; player.y = H-player.size; }
  if (player.y+player.size > H) { mapY++; player.y = 0; }
}

// ================================
// 描画
// ================================
function draw(){
  const key = `${mapX},${mapY}`;
  if (status[`bg_${key}`]==='loaded'){
    ctx.drawImage(images[`bg_${key}`],0,0,W,H);
  } else {
    ctx.fillStyle='#333'; ctx.fillRect(0,0,W,H);
  }

  const map = maps[key];
  map.objects.forEach((o,i)=>{
    if (o.img && status[`obj_${key}_${i}`]==='loaded'){
      ctx.drawImage(images[`obj_${key}_${i}`],o.x,o.y,o.w,o.h);
    }
  });

  if (player.img.complete){
    ctx.drawImage(player.img,player.x,player.y,player.size,player.size);
  } else {
    ctx.fillStyle='#f55'; ctx.fillRect(player.x,player.y,player.size,player.size);
  }

  ctx.fillStyle='#fff';
  ctx.font='16px sans-serif';
  ctx.fillText(map.name,10,20);
  ctx.font='20px monospace';
  ctx.fillText(formatTime(timeLeft),W-90,24);
}

// ================================
// メインループ
// ================================
function loop(now){
  const dt = (now-lastTime)/1000;
  lastTime = now;
  timeLeft -= dt;

  if (timeLeft<=0){
    ctx.fillStyle='rgba(0,0,0,0.7)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#fff';
    ctx.font='24px sans-serif';
    ctx.fillText('TIME UP',W/2-60,H/2);
    return;
  }

  update();
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
