<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ユメっ子探せ</title>

  <style>
    body {
      margin: 0;
      background: #222;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #fff;
      font-family: sans-serif;
      overflow: hidden;
    }

    canvas {
      background: #000;
      border: 4px solid #fff;
    }

    #nameForm,
    #chatForm {
      display: flex;
      gap: 5px;
      margin-bottom: 5px;
    }

    #nameForm input,
    #chatForm input {
      padding: 5px;
      font-size: 16px;
    }

    #chatForm input {
      flex: 1;
    }

    #touchControls {
      position: absolute;
      bottom: 10px;
      display: flex;
      gap: 10px;
    }

    .touchButton {
      width: 60px;
      height: 60px;
      background: rgba(255,255,255,0.3);
      color: #fff;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      user-select: none;
      touch-action: none;
    }
  </style>
</head>

<body>

  <form id="nameForm">
    <input type="text" id="playerName" placeholder="名前を入力" maxlength="10">
    <button type="submit">決定</button>
  </form>

  <form id="chatForm">
    <input type="text" id="chatInput" placeholder="チャットを入力" maxlength="50">
    <button type="submit">送信</button>
  </form>

  <canvas id="game" width="400" height="300"></canvas>

  <div id="touchControls" style="display:none;">
    <div class="touchButton" data-key="w">↑</div>
    <div class="touchButton" data-key="s">↓</div>
    <div class="touchButton" data-key="a">←</div>
    <div class="touchButton" data-key="d">→</div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
    import {
      getDatabase, ref, set, onValue, remove,
      onChildAdded, push, query, orderByChild, equalTo
    } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

    /* ================= Firebase 設定 ================= */
    const firebaseConfig = {
      apiKey: "AIzaSyAXO76mF3C0TQAHkFsFUqDsI6JXOqGgMlw",
      authDomain: "zzonline.firebaseapp.com",
      databaseURL: "https://zzonline-default-rtdb.firebaseio.com",
      projectId: "zzonline",
      storageBucket: "zzonline.firebasestorage.app",
      messagingSenderId: "50179905692",
      appId: "1:50179905692:web:12b9664ac730e6a58d3559",
      measurementId: "G-NMVHG2XN1F"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    /* ================= ユーザーID ================= */
    let userId = sessionStorage.getItem("userId");
    if (!userId) {
      userId = "user_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
      sessionStorage.setItem("userId", userId);
    }

    /* ================= 名前取得 ================= */
    let playerName = localStorage.getItem("playerName") || "";
    const nameForm = document.getElementById("nameForm");
    const nameInput = document.getElementById("playerName");

    if (playerName) nameForm.style.display = "none";

    nameForm.addEventListener("submit", e => {
      e.preventDefault();
      if (!nameInput.value.trim()) return;

      playerName = nameInput.value.trim();
      localStorage.setItem("playerName", playerName);
      nameForm.style.display = "none";

      const q = query(
        ref(db, "players"),
        orderByChild("name"),
        equalTo(playerName)
      );

      onValue(q, snapshot => {
        const data = snapshot.val();
        if (data) {
          for (const id in data) {
            if (id !== userId) {
              remove(ref(db, "players/" + id));
            }
          }
        }
      }, { onlyOnce: true });
    });

    /* ================= Canvas ================= */
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const W = canvas.width;
    const H = canvas.height;

    /* ================= プレイヤー ================= */
    const player = {
      x: 80,
      y: 30,
      size: 24,
      speed: 1.2,
      img: new Image(),
      imgLoaded: false
    };

    player.img.src = "https://picsum.photos/seed/player/48";
    player.img.onload = () => player.imgLoaded = true;

    const otherPlayers = {};
    const otherImages = {};

    /* ================= マップ ================= */
    const maps = {
      "0,0": {
        name: "スタート",
        bg: "https://picsum.photos/id/1015/400/300",
        objects: [
          { type: "block", x: 150, y: 80, w: 64, h: 64, img: "https://picsum.photos/id/1056/64/64" },
          { type: "event", x: 60, y: 200, w: 80, h: 40, event: "A" }
        ]
      },
      "1,0": {
        name: "右の森",
        bg: "https://picsum.photos/id/1020/400/300",
        objects: [
          { type: "block", x: 220, y: 120, w: 64, h: 64, img: "https://picsum.photos/id/1062/64/64" }
        ]
      },
      "-1,0": {
        name: "左の森",
        bg: "https://picsum.photos/id/1016/400/300",
        objects: [
          { type: "block", x: 150, y: 80, w: 64, h: 64, img: "https://picsum.photos/id/1056/64/64" },
          { type: "grass", x: 60, y: 200, w: 80, h: 40, event: "A" }
        ]
      }
    };

    const images = {};
    const status = {};

    function loadImage(key, src) {
      const img = new Image();
      status[key] = "loading";
      img.onload = () => status[key] = "loaded";
      img.onerror = () => status[key] = "error";
      img.src = src;
      images[key] = img;
    }

    for (const k in maps) {
      loadImage(`bg_${k}`, maps[k].bg);
      maps[k].objects.forEach((o, i) => {
        if (o.img) loadImage(`obj_${k}_${i}`, o.img);
      });
    }

    /* ================= 入力 ================= */
    const keyState = {};
    addEventListener("keydown", e => keyState[e.key.toLowerCase()] = true);
    addEventListener("keyup", e => keyState[e.key.toLowerCase()] = false);

    /* ================= 当たり判定 ================= */
    function hit(a, b) {
      return (
        a.x < b.x + b.w &&
        a.x + a.size > b.x &&
        a.y < b.y + b.h &&
        a.y + a.size > b.y
      );
    }

    /* ================= メインループ ================= */
    let mapX = 0;
    let mapY = 0;

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    requestAnimationFrame(loop);

    window.addEventListener("beforeunload", () => {
      remove(ref(db, "players/" + userId));
    });
  </script>

</body>
</html>
