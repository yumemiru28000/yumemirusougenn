<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ユメっ子探a1せ</title>

<style>
/* ====================== 基本スタイル ====================== */
body{
  margin:0;
  background:#222;
  color:#fff;
  font-family:sans-serif;
  overflow:hidden;
  position:relative;
  height:100vh;
}
canvas{
  background:#000;
  border:4px solid #fff;
  width:400px;
  height:300px;
  display:block;
}
#nameForm,#chatForm{
  display:flex;
  gap:5px;
  margin-bottom:5px;
  position:absolute;
  z-index:10;
}
#nameForm input,#chatForm input{
  padding:5px;
  font-size:16px;
}
#chatForm input{flex:1;}
#touchControls{
  position:absolute;
  bottom:80px;
  display:flex;
  gap:10px;
  z-index:10;
}
.touchButton{
  width:60px;
  height:60px;
  background:rgba(255,255,255,0.3);
  color:#fff;
  font-size:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  user-select:none;
  touch-action:none;
}
#extraButtons{
  position:absolute;
  bottom:150px;
  display:flex;
  gap:10px;
  z-index:10;
}
#extraButtons .touchButton{
  background:rgba(0,200,255,0.4);
}
</style>
</head>

<body>

<!-- ====================== 名前入力 ====================== -->
<form id="nameForm">
  <input type="text" id="playerName" placeholder="名前を入力" maxlength="10">
  <button type="submit">決定</button>
</form>

<!-- ====================== チャット ====================== -->
<form id="chatForm" style="top:10px;left:10px;">
  <input type="text" id="chatInput" placeholder="チャットを入力" maxlength="50">
  <button type="submit">送信</button>
</form>

<!-- ====================== ゲーム画面 ====================== -->
<canvas id="game" width="400" height="300"></canvas>

<!-- ====================== タッチ操作 ====================== -->
<div id="touchControls" style="display:none;">
  <div class="touchButton" data-key="w">↑</div>
  <div class="touchButton" data-key="s">↓</div>
  <div class="touchButton" data-key="a">←</div>
  <div class="touchButton" data-key="d">→</div>
</div>

<div id="extraButtons" style="display:none;">
  <div class="touchButton" data-key="shift">しゃがむ</div>
  <div class="touchButton" data-key="space">探す</div>
</div>

<script type="module">
/* =========================================================
   Firebase
========================================================= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
import {
  getDatabase, ref, set, onValue,
  remove, onChildAdded, onChildRemoved,
  push, get
} from "https://www.gstatic.com/firebasejs/12.7.0/firebase-database.js";

const firebaseConfig={
  apiKey:"AIzaSyAXO76mF3C0TQAHkFsFUqDsI6JXOqGgMlw",
  authDomain:"zzonline.firebaseapp.com",
  databaseURL:"https://zzonline-default-rtdb.firebaseio.com",
  projectId:"zzonline",
  storageBucket:"zzonline.firebasestorage.app",
  messagingSenderId:"50179905692",
  appId:"1:50179905692:web:12b9664ac730e6a58d3559"
};

const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

/* =========================================================
   ユーザーID管理
========================================================= */
let userId=sessionStorage.getItem("userId");
if(!userId){
  userId="user_"+Date.now()+"_"+Math.floor(Math.random()*1000);
  sessionStorage.setItem("userId",userId);
}

/* =========================================================
   名前処理
========================================================= */
let playerName=localStorage.getItem("playerName")||"";
const nameForm=document.getElementById("nameForm");
const nameInput=document.getElementById("playerName");
if(playerName) nameForm.style.display="none";

nameForm.addEventListener("submit",async e=>{
  e.preventDefault();
  if(!nameInput.value.trim()) return;
  playerName=nameInput.value.trim();
  localStorage.setItem("playerName",playerName);
  nameForm.style.display="none";

  const snap=await get(ref(db,"players"));
  const data=snap.val()||{};
  for(const id in data){
    if(data[id].name===playerName && id!==userId){
      remove(ref(db,"players/"+id));
    }
  }
  sendPosition();
});

/* =========================================================
   Canvas
========================================================= */
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=canvas.width;
const H=canvas.height;

function resizeCanvas(){
  const s=Math.min(window.innerWidth/W,window.innerHeight/H);
  canvas.style.transform=`scale(${s})`;
  canvas.style.transformOrigin="top left";
  canvas.style.left=(window.innerWidth-W*s)/2+"px";
  canvas.style.top=(window.innerHeight-H*s)/2+"px";
  canvas.style.position="absolute";
}
addEventListener("resize",resizeCanvas);
resizeCanvas();

/* =========================================================
   プレイヤー（拡張版）
========================================================= */
const player={
  x:80,
  y:30,
  size:24,
  speed:1.2,
  direction:"down",
  state:"idle",   // idle / walk / crouch
  moving:false,
  shift:false,
  hidden:false
};

/* =========================================================
   スプライト管理
========================================================= */
const sprite={
  walk:{up:new Image(),down:new Image(),left:new Image(),right:new Image()},
  idle:{up:new Image(),down:new Image(),left:new Image(),right:new Image()},
  crouch:{up:new Image(),down:new Image(),left:new Image(),right:new Image()}
};

// ★ 各自の実画像URLに変更してください
sprite.walk.up.src="walk_up.gif";
sprite.walk.down.src="walk_down.gif";
sprite.walk.left.src="walk_left.gif";
sprite.walk.right.src="walk_right.gif";

sprite.idle.up.src="idle_up.png";
sprite.idle.down.src="idle_down.png";
sprite.idle.left.src="idle_left.png";
sprite.idle.right.src="idle_right.png";

sprite.crouch.up.src="crouch_up.png";
sprite.crouch.down.src="crouch_down.png";
sprite.crouch.left.src="crouch_left.png";
sprite.crouch.right.src="crouch_right.png";

/* =========================================================
   他プレイヤー
========================================================= */
const otherPlayers={};

/* =========================================================
   入力管理
========================================================= */
const keyState={};

addEventListener("keydown",e=>{
  keyState[e.key.toLowerCase()]=true;
  if(e.key==="Shift") player.shift=true;
  if(e.key===" "||e.key==="Space") triggerSpaceEvent();
});
addEventListener("keyup",e=>{
  keyState[e.key.toLowerCase()]=false;
  if(e.key==="Shift") player.shift=false;
});

/* =========================================================
   タッチ操作
========================================================= */
const isMobile=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
if(isMobile){
  document.getElementById("touchControls").style.display="flex";
  document.getElementById("extraButtons").style.display="flex";
}
document.querySelectorAll(".touchButton").forEach(b=>{
  const k=b.dataset.key;
  b.addEventListener("touchstart",e=>{
    e.preventDefault();
    if(k==="shift") player.shift=true;
    else if(k==="space") triggerSpaceEvent();
    else keyState[k]=true;
  });
  b.addEventListener("touchend",e=>{
    e.preventDefault();
    if(k==="shift") player.shift=false;
    else keyState[k]=false;
  });
});

/* =========================================================
   マップ
========================================================= */
const maps={
  "0,0":{
    name:"スタート",
    bg:"https://picsum.photos/id/1015/400/300",
    objects:[
      {type:"block",x:150,y:80,w:64,h:64},
      {type:"grass",x:60,y:200,w:80,h:40}
    ]
  }
};

let mapX=0,mapY=0;

/* =========================================================
   当たり判定
========================================================= */
function hit(a,b){
  return a.x<b.x+b.w &&
         a.x+a.size>b.x &&
         a.y<b.y+b.h &&
         a.y+a.size>b.y;
}

function isOnGrass(){
  const map=maps[`${mapX},${mapY}`];
  for(const o of map.objects){
    if(o.type==="grass" && hit(player,o)) return true;
  }
  return false;
}

/* =========================================================
   草イベント
========================================================= */
function triggerSpaceEvent(){
  if(!isOnGrass()) return;
  if(Math.random()<1/20){
    player.hidden=true;
    remove(ref(db,"players/"+userId));
    location.href="index.html";
  }
}

/* =========================================================
   Firebase送信（拡張）
========================================================= */
function sendPosition(){
  if(player.hidden) return;
  set(ref(db,"players/"+userId),{
    x:player.x,
    y:player.y,
    mapX,mapY,
    name:playerName,
    direction:player.direction,
    state:player.state,
    timestamp:Date.now()
  });
}
/* =========================================================
   他プレイヤー同期取得
========================================================= */
const playersRef = ref(db,"players");

onValue(playersRef,snapshot=>{
  const data=snapshot.val()||{};
  for(const id in data){
    if(id!==userId){
      otherPlayers[id]=data[id];
    }
  }
});

onChildRemoved(playersRef,snap=>{
  delete otherPlayers[snap.key];
});

/* =========================================================
   更新処理（移動＋状態管理）
========================================================= */
function update(){
  const map=maps[`${mapX},${mapY}`];
  if(!map) return;

  const ox=player.x;
  const oy=player.y;
  player.moving=false;

  if(keyState.w){
    player.y-=player.speed;
    player.direction="up";
    player.moving=true;
  }
  if(keyState.s){
    player.y+=player.speed;
    player.direction="down";
    player.moving=true;
  }
  if(keyState.a){
    player.x-=player.speed;
    player.direction="left";
    player.moving=true;
  }
  if(keyState.d){
    player.x+=player.speed;
    player.direction="right";
    player.moving=true;
  }

  // ===== 状態決定 =====
  if(player.shift){
    player.state="crouch";
  }else if(player.moving){
    player.state="walk";
  }else{
    player.state="idle";
  }

  // ===== 当たり判定 =====
  for(const o of map.objects){
    if(o.type==="block" && hit(player,o)){
      player.x=ox;
      player.y=oy;
    }
  }

  // ===== マップ端 =====
  let nx=mapX, ny=mapY;
  if(player.x<0) nx--;
  if(player.x+player.size>W) nx++;
  if(player.y<0) ny--;
  if(player.y+player.size>H) ny++;

  if(maps[`${nx},${ny}`]){
    mapX=nx;
    mapY=ny;
    if(player.x<0) player.x=W-player.size;
    if(player.x+player.size>W) player.x=0;
    if(player.y<0) player.y=H-player.size;
    if(player.y+player.size>H) player.y=0;
  }else{
    player.x=ox;
    player.y=oy;
  }

  if(playerName) sendPosition();
}

/* =========================================================
   描画：背景
========================================================= */
function drawBackground(){
  ctx.fillStyle="#333";
  ctx.fillRect(0,0,W,H);
}

/* =========================================================
   描画：オブジェクト
========================================================= */
function drawObjects(){
  const map=maps[`${mapX},${mapY}`];
  for(const o of map.objects){
    if(o.type==="block"){
      ctx.fillStyle="#555";
      ctx.fillRect(o.x,o.y,o.w,o.h);
    }
    if(o.type==="grass"){
      ctx.fillStyle="#0a0";
      ctx.fillRect(o.x,o.y,o.w,o.h);
    }
  }
}

/* =========================================================
   描画：プレイヤー
========================================================= */
function drawPlayerEntity(p,isSelf){
  const img =
    p.state==="walk"   ? sprite.walk[p.direction] :
    p.state==="crouch" ? sprite.crouch[p.direction] :
                         sprite.idle[p.direction];

  ctx.drawImage(img,p.x,p.y,player.size,player.size);

  ctx.fillStyle="#fff";
  ctx.font="12px sans-serif";
  ctx.fillText(p.name||"",p.x,p.y-5);
}

/* =========================================================
   描画メイン
========================================================= */
function draw(){
  drawBackground();
  drawObjects();

  // 他プレイヤー
  for(const id in otherPlayers){
    const p=otherPlayers[id];
    if(p.mapX===mapX && p.mapY===mapY){
      drawPlayerEntity(p,false);
    }
  }

  // 自分
  if(!player.hidden){
    drawPlayerEntity({
      x:player.x,
      y:player.y,
      state:player.state,
      direction:player.direction,
      name:playerName
    },true);
  }

  // マップ名
  ctx.fillStyle="#fff";
  ctx.font="16px sans-serif";
  ctx.fillText(maps[`${mapX},${mapY}`].name,10,20);

  // 時計
  const now=new Date();
  ctx.font="18px monospace";
  ctx.fillText(
    `${now.getHours().toString().padStart(2,"0")}:`+
    `${now.getMinutes().toString().padStart(2,"0")}:`+
    `${now.getSeconds().toString().padStart(2,"0")}`,
    W-110,22
  );
}

/* =========================================================
   メインループ
========================================================= */
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* =========================================================
   切断処理
========================================================= */
addEventListener("beforeunload",()=>{
  remove(ref(db,"players/"+userId));
});
</script>
</body>
</html>
