<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title> 作業MMOa【Ｚｚにゃん島】  </title>
<style>
body { margin: 0; background: #222; color: #fff; font-family: sans-serif; overflow: hidden; position: relative; height: 100vh;}
canvas { background: #000; border: 4px solid #fff; width: 400px; height: 300px; display: block; }
#nameForm, #chatForm { display: flex; gap: 5px; margin-bottom: 5px; position: absolute; z-index: 10; }
#nameForm input, #chatForm input { padding: 5px; font-size: 16px; }
#chatForm input { flex: 1; }
#touchControls { position: absolute; bottom: 80px; display: flex; gap: 10px; z-index: 10; }
.touchButton { width: 60px; height: 60px; background: rgba(255,255,255,0.3); color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center; border-radius: 10px; user-select: none; touch-action: none; }
#extraButtons { position: absolute; bottom: 150px; display:flex; gap:10px; z-index: 10; }
#extraButtons .touchButton { background: rgba(0,200,255,0.4); }
#sideUI{ position:absolute; right:20px; top:50%; transform:translateY(-50%); width:200px; text-align:center; z-index:5; }
#zoneImage{ width:100%; display:none; }
#zoneText{ margin-top:8px; font-size:14px; }
.volumeBox{ margin-top:20px; }
</style>
</head>
<body>

<!--
追加機能: 色駆動・仮想視点マップギミック 組み込み版
使い方（短縮）
- 各 maps[mapKey] に次の任意プロパティを追加できます:
  - collisionBlack: URL (黒 PNG、通行不可判定用) ─ 非表示。存在すれば最優先でブロック判定に使われます。
  - areaColor: URL (色エリア判定 PNG) ─ 非表示。プレイヤーがどの color_xxx を使うか決めます。
  - colorSets: { yellow: baseUrl, green: baseUrl, orange: baseUrl, pink: baseUrl }
    baseUrl はその色フォルダのルート URL（例: https://.../map_xxx/color_yellow）
    フォルダ内のファイル名は仕様に従います:
      - white.png   (上下位置制御)
      - purple.png  (可視性制御)
      - blue.png    (スケール制御)
      - red.png     (横位置制御)
      - view_side.png (横視点背景、表示される)
- 既存の collisionMask（以前の実装）も互換性のため残しています（mask_${key}）。
- color PNGs と mask PNGs は CORS ヘッダが必要です（getImageData を使うため）。
-->

<form id="nameForm">
  <input type="text" id="playerName" placeholder="名前を入力" maxlength="10">
  <button type="submit">決定</button>
</form>

<form id="chatForm" style="top: 10px; left: 10px;">
  <input type="text" id="chatInput" placeholder="チャットを入力" maxlength="50">
  <button type="submit">送信</button>
</form>

<div id="sideUI">
  <img id="zoneImage" src="" />
  <div id="zoneText"></div>
  <div class="volumeBox">
    <label>BGM音量</label>
    <input type="range" id="bgmVolume" min="0" max="1" step="0.01" value="0.6">
  </div>
</div>

<canvas id="game" width="400" height="300"></canvas>

<div id="touchControls" style="display:none;">
  <div class="touchButton" data-key="w">↑</div>
  <div class="touchButton" data-key="s">↓</div>
  <div class="touchButton" data-key="a">←</div>
  <div class="touchButton" data-key="d">→</div>
</div>

<div id="extraButtons" style="display:none;">
  <div class="touchButton" data-key="shift">シフト</div> 
  <div class="touchButton" data-key="space">探す</div>
</div>

  nameForm.style.display='none';

    }

});

function resizeCanvas(){ const scaleX = window.innerWidth / W; const scaleY = window.innerHeight / H; const scale = Math.min(scaleX, scaleY); canvas.style.transform = `scale(${scale})`; canvas.style.transformOrigin = 'top left'; canvas.style.left = `${(window.innerWidth - W*scale)/2}px`; canvas.style.top  = `${(window.innerHeight - H*scale)/2}px`; canvas.style.position = 'absolute'; }

/* --- BGM / UI --- */
let currentBgmZoneId = null;
const singleBgmAudio = new Audio(); singleBgmAudio.loop = true; singleBgmAudio.volume = 0.6;
const albumBgmAudio = new Audio(); albumBgmAudio.loop = false; albumBgmAudio.volume = 0.6;
const bgmVolume = document.getElementById('bgmVolume');
bgmVolume.addEventListener('input', ()=>{ singleBgmAudio.volume = bgmVolume.value; albumBgmAudio.volume  = bgmVolume.value; });

function playSingleBgm(url){ if(singleBgmAudio.src !== url){ singleBgmAudio.src = url; singleBgmAudio.play(); } }
function stopSingleBgm(){ singleBgmAudio.pause(); singleBgmAudio.currentTime = 0; }
let albumList=[], albumIndex=0, albumActive=false;
function playAlbum(list){ if(albumActive && JSON.stringify(albumList)===JSON.stringify(list)) return; albumList=list; albumIndex=0; albumActive=true; albumBgmAudio.src=albumList[albumIndex]; albumBgmAudio.play(); albumBgmAudio.onended=()=>{ if(!albumActive) return; albumIndex=(albumIndex+1)%albumList.length; albumBgmAudio.src=albumList[albumIndex]; albumBgmAudio.play(); }; }
function stopAlbum(){ albumActive=false; albumBgmAudio.pause(); albumBgmAudio.currentTime=0; }

function checkBgmZone(){
  let singleHit=null, albumHit=null;
  for(const zone of worldBgmZones){
    if(mapX>=zone.mapX1 && mapX<=zone.mapX2 && mapY>=zone.mapY1 && mapY<=zone.mapY2){
      if(zone.type==='single') singleHit=zone;
      if(zone.type==='album') albumHit=zone;
    }
  }
  if(singleHit) playSingleBgm(singleHit.url); else stopSingleBgm();
  if(albumHit) playAlbum(albumHit.list); else stopAlbum();
}

/* --- 画像 / ピクセルデータキャッシュ --- 
   keys used:
     - bg_${key}
     - obj_${key}_${i}
     - mask_${key}       (legacy collisionMask / per-map PNG)
     - black_${key}      (collisionBlack)
     - area_${key}       (areaColor)
     - color_${key}_${c}_white / _purple / _blue / _red  (color rule images)
     - view_${key}_${c}  (view_side for that color)
*/
const imagePixelData = {}; // key -> { data, width, height } | null
const images = {};
const status = {};

function loadImage(key, src){
  if(!src) { status[key] = 'none'; imagePixelData[key] = null; return; }
  const img = new Image();
  status[key] = 'loading';
  img.crossOrigin = 'anonymous';
  img.onload = ()=>{
    status[key] = 'loaded';
    images[key] = img;
    try{
      const c = document.createElement('canvas');
      c.width = img.width; c.height = img.height;
      const cx = c.getContext('2d');
      cx.drawImage(img,0,0);
      const imageData = cx.getImageData(0,0,c.width,c.height);
      imagePixelData[key] = { data: imageData.data, width: imageData.width, height: imageData.height };
    }catch(e){
      imagePixelData[key] = null;
    }
  };
  img.onerror = ()=>{ status[key] = 'error'; imagePixelData[key] = null; images[key]=img; };
  img.src = src;
}

/* --- preload images for maps:
   bg, collisionMask, collisionBlack, areaColor, objects, and colorSets (white/purple/blue/red/view_side)
*/
for(const k in maps){
  loadImage(`bg_${k}`, maps[k].bg);
  if(maps[k].collisionMask) loadImage(`mask_${k}`, maps[k].collisionMask);
  if(maps[k].collisionBlack) loadImage(`black_${k}`, maps[k].collisionBlack);
  if(maps[k].areaColor) loadImage(`area_${k}`, maps[k].areaColor);

  // objects
  maps[k].objects.forEach((o,i)=>{
    if(o.img) loadImage(`obj_${k}_${i}`, o.img);
  });

  // colorSets
  const sets = maps[k].colorSets;
  if(sets){
    for(const color in sets){
      const base = sets[color].replace(/\/$/, '');
      loadImage(`color_${k}_${color}_white`, `${base}/white.png`);
      loadImage(`color_${k}_${color}_purple`, `${base}/purple.png`);
      loadImage(`color_${k}_${color}_blue`, `${base}/blue.png`);
      loadImage(`color_${k}_${color}_red`, `${base}/red.png`);
      loadImage(`view_${k}_${color}`, `${base}/view_side.png`);
    }
  }
}

/* --- Pixel sampling helper ---
   samplePixel(key, mapKey, canvasX, canvasY)
   - key: imagePixelData key (eg. 'area_50,0', 'black_50,0', 'color_50,0_yellow_white', etc)
   - canvasX/canvasY: coordinates in canvas space (0..W-1, 0..H-1)
   returns {r,g,b,a} or null if no pixel data
*/
function samplePixel(key, canvasX, canvasY){
  const pixel = imagePixelData[key];
  if(!pixel) return null;
  // image drawn/scaled to W x H on canvas; map image resolution may differ -> scale canvas coords to image coords
  const ix = Math.floor(canvasX * (pixel.width / W));
  const iy = Math.floor(canvasY * (pixel.height / H));
  if(ix < 0 || ix >= pixel.width || iy < 0 || iy >= pixel.height) return null;
  const idx = (iy * pixel.width + ix) * 4;
  return { r: pixel.data[idx], g: pixel.data[idx+1], b: pixel.data[idx+2], a: pixel.data[idx+3] };
}

/* --- Collision: black mask (highest priority) ---
   returns true if blocked
*/
function isBlockedByBlack(mapKey, px, py, playerSize){
  const key = `black_${mapKey}`;
  // fallback: if black not provided, try legacy mask key if user used that as black
  const pixelKey = imagePixelData[key] ? key : (imagePixelData[`mask_${mapKey}`] ? `mask_${mapKey}` : null);
  if(!pixelKey) return false;
  // sample region inside the player's rectangle
  const step = Math.max(1, Math.floor(playerSize / 6));
  for(let y = Math.floor(py); y <= Math.floor(py + playerSize - 1); y += step){
    for(let x = Math.floor(px); x <= Math.floor(px + playerSize - 1); x += step){
      const p = samplePixel(pixelKey, x, y);
      if(p && p.a > 10){
        // black mask normally should be pure black; we only check alpha > threshold
        return true;
      }
    }
  }
  return false;
}

/* --- Legacy map mask passability (keeps earlier behavior) ---
   was isPassableByMapMask, now renamed
*/
function isPassableByMapMaskLegacy(mapKey, px, py, playerSize){
  const maskKey = `mask_${mapKey}`;
  const pixel = imagePixelData[maskKey];
  if(!pixel) return true;
  const scaleX = pixel.width / W;
  const scaleY = pixel.height / H;
  const sampleStep = Math.max(1, Math.floor(playerSize / 6));
  const startX = Math.max(0, Math.floor(px));
  const startY = Math.max(0, Math.floor(py));
  const endX = Math.min(W - 1, Math.floor(px + playerSize - 1));
  const endY = Math.min(H - 1, Math.floor(py + playerSize - 1));
  for(let yy = startY; yy <= endY; yy += sampleStep){
    for(let xx = startX; xx <= endX; xx += sampleStep){
      const mx = Math.floor(xx * scaleX);
      const my = Math.floor(yy * scaleY);
      if(mx < 0 || mx >= pixel.width || my < 0 || my >= pixel.height) continue;
      const idx = (my * pixel.width + mx) * 4 + 3;
      if(pixel.data[idx] > 10) return false;
    }
  }
  return true;
}

/* --- Virtual view calculation for a given player (local or remote)
   returns an object:
   {
     virtualActive: boolean,
     viewImageKey: 'view_mapKey_color' or null,
     params: { white:0..1, purple:0..1, blue:0..1, red:0..1 }
   }
*/
function computeVirtualForPlayer(mapKey, px, py){
  const areaKey = `area_${mapKey}`;
  const areaPixel = samplePixel(areaKey, px + Math.floor(player.size/2), py + Math.floor(player.size/2));
  if(!areaPixel) return { virtualActive:false };

  // If transparent (alpha == 0) -> no virtual view
  if(areaPixel.a === 0) return { virtualActive:false };

  // Map the sampled color to one of the four: yellow / green / orange / pink
  // The design assumes pure colors. We'll compare by RGB.
  const r = areaPixel.r, g = areaPixel.g, b = areaPixel.b;
  const colorName = (() => {
    // simple matching (pure colors):
    if(r > 200 && g > 200 && b < 100) return 'yellow'; // r+g high
    if(g > 200 && r < 100 && b < 100) return 'green';
    if(r > 200 && g > 120 && b < 120 && g < r) return 'orange'; // heuristic
    if(r > 200 && b > 200 && g < 120) return 'pink'; // r+b
    // fallback: try specific exact matches if necessary
    return null;
  })();

  if(!colorName) return { virtualActive:false };

  // check whether colorSet exists for this map/color
  const sets = maps[mapKey] && maps[mapKey].colorSets;
  if(!sets || !sets[colorName]) return { virtualActive:false };

  const prefixWhite = `color_${mapKey}_${colorName}_white`;
  const prefixPurple = `color_${mapKey}_${colorName}_purple`;
  const prefixBlue   = `color_${mapKey}_${colorName}_blue`;
  const prefixRed    = `color_${mapKey}_${colorName}_red`;
  const viewKey      = `view_${mapKey}_${colorName}`;

  // sample each rule png at player's center
  const cx = px + player.size/2;
  const cy = py + player.size/2;

  const whiteP = samplePixel(prefixWhite, cx, cy);
  const purpleP = samplePixel(prefixPurple, cx, cy);
  const blueP   = samplePixel(prefixBlue, cx, cy);
  const redP    = samplePixel(prefixRed, cx, cy);

  // convert sampled pixel to intensity 0..1
  const intensity = (p)=> {
    if(!p) return 0;
    // if using grayscale images, use average of RGB or alpha
    const alphaBased = p.a / 255;
    const lum = ((p.r + p.g + p.b) / 3) / 255;
    // prefer alpha if present, otherwise luminance
    return p.a > 10 ? alphaBased : lum;
  };

  const whiteV = intensity(whiteP);
  const purpleV = intensity(purpleP);
  const blueV = intensity(blueP);
  const redV = intensity(redP);

  return {
    virtualActive: true,
    colorName,
    viewImageKey: status[viewKey] === 'loaded' ? viewKey : null,
    params: { white: whiteV, purple: purpleV, blue: blueV, red: redV }
  };
}

/* --- Drawing helpers for virtual avatar ---
   Draw an avatar (image) at given virtual screen position with scale/alpha/blur
*/
function drawVirtualAvatar(img, x, y, size, {scale=1, alpha=1, blur=false}, name){
  ctx.save();
  if(blur) ctx.filter = 'blur(2px)';
  ctx.globalAlpha = alpha;
  const drawW = size * scale;
  const drawH = size * scale;
  ctx.drawImage(img, x - drawW/2, y - drawH/2, drawW, drawH);
  ctx.globalAlpha = 1.0;
  ctx.filter = 'none';
  // name
  if(name){
    ctx.fillStyle = `rgba(255,255,255,${alpha})`;
    ctx.font = '12px sans-serif';
    ctx.fillText(name, x - drawW/2, y - drawH/2 - 6);
  }
  ctx.restore();
}

/* --- Update / Draw --- */
function update() {
  const key = mapX + ',' + mapY;
  if(!maps[key]) return;
  const map = maps[key];

  const ox = player.x, oy = player.y;
  player.moving = false;
  player.crouch = player.shift;

  if (keyState.w) { player.y -= player.speed; player.dir = 'up'; player.moving = true; }
  if (keyState.s) { player.y += player.speed; player.dir = 'down'; player.moving = true; }
  if (keyState.a) { player.x -= player.speed; player.dir = 'left'; player.moving = true; }
  if (keyState.d) { player.x += player.speed; player.dir = 'right'; player.moving = true; }

  // footstep audio handling
  const anyMoveKey = keyState['w'] || keyState['a'] || keyState['s'] || keyState['d'];
  if(anyMoveKey && !footstepPlaying){
    try{ footstepAudio.currentTime = 0; footstepAudio.play(); }catch(e){}
    footstepPlaying = true;
  }else if(!anyMoveKey && footstepPlaying){
    try{ footstepAudio.pause(); footstepAudio.currentTime = 0; }catch(e){}
    footstepPlaying = false;
  }

  // Gate handling (existing)
  for (const obj of map.objects){
    if (obj.type === 'gate'){
      const need = (typeof countPlayersInRange === 'function') ? countPlayersInRange(obj) : (obj.need || 1);
      const near = (typeof playersNearGate === 'function') ? playersNearGate(obj) : 0;
      if (near >= need){
        for (const id in otherPlayers){
          const p = otherPlayers[id];
          if (p.mapX>=obj.range.mapX1 && p.mapX<=obj.range.mapX2 && p.mapY>=obj.range.mapY1 && p.mapY<=obj.range.mapY2){
            set(ref(db,'players/'+id),{ ...p, mapX:obj.to.mapX, mapY:obj.to.mapY, x:obj.to.x, y:obj.to.y, timestamp:Date.now() });
          }
        }
        mapX = obj.to.mapX; mapY = obj.to.mapY; player.x = obj.to.x; player.y = obj.to.y;
      }
    }
  }

  // Object collisions (obj pixel/mask), same as before
  let blockedByObject = false;
  for(let i=0;i<map.objects.length;i++){
    const obj = map.objects[i];
    if(hit(player,obj)){
      if(obj.type === 'block'){
        const objPixelResult = isPassableByObjectPixel(key, i, player.x, player.y, player.size, obj);
        if(objPixelResult === false){
          blockedByObject = true;
          break;
        }else if(objPixelResult === null){
          blockedByObject = true;
          break;
        }
      }
      if(obj.type === 'warp'){
        player.x = obj.to.x; player.y = obj.to.y; mapX = obj.to.mapX; mapY = obj.to.mapY;
      }
    }
  }

  // Collision black (highest priority)
  let blockedByBlack = isBlockedByBlack(key, player.x, player.y, player.size);

  // Legacy mask passability (if exists)
  let blockedByMapMask = false;
  if(!blockedByObject && !blockedByBlack){
    const passable = isPassableByMapMaskLegacy(key, player.x, player.y, player.size);
    if(!passable) blockedByMapMask = true;
  }

  if(blockedByObject || blockedByBlack || blockedByMapMask){
    player.x = ox; player.y = oy;
  }

  // Map bounds / tile transitions
  let nx = mapX, ny = mapY;
  if (player.x < 0) nx--;
  if (player.x + player.size > W) nx++;
  if (player.y < 0) ny--;
  if (player.y + player.size > H) ny++;

  if (maps[nx + ',' + ny]) {
    mapX = nx; mapY = ny;
    if (player.x < 0) player.x = W - player.size;
    if (player.x + player.size > W) player.x = 0;
    if (player.y < 0) player.y = H - player.size;
    if (player.y + player.size > H) player.y = 0;
  } else {
    // do nothing
  }

  if (playerName) sendPosition();
  checkBgmZone();
  checkUiZone();
}

/* --- helper: getImage(p) --- */
function getImage(p){ if(p.crouch) return sprites.crouch[p.dir]; if(p.moving) return sprites.walk[p.dir]; return sprites.idle[p.dir]; }

/* --- Draw --- */
function draw(){
  const key = `${mapX},${mapY}`;
  const map = maps[key];

  // compute virtual state for local player
  const localVirtual = computeVirtualForPlayer(key, player.x, player.y);

  // If virtualActive and has view image -> draw view_side background
  if(localVirtual.virtualActive && localVirtual.viewImageKey && status[localVirtual.viewImageKey] === 'loaded'){
    ctx.drawImage(images[localVirtual.viewImageKey], 0, 0, W, H);
  } else if(status[`bg_${key}`]==='loaded'){
    ctx.drawImage(images[`bg_${key}`],0,0,W,H);
  } else {
    ctx.fillStyle='#333';
    ctx.fillRect(0,0,W,H);
  }

  // When in virtual mode, we skip drawing top-down objects (they belong to a different visual).
  // We still want to draw other players and local player using virtual parameters.
  if(!(localVirtual.virtualActive && localVirtual.viewImageKey)){
    // draw top-down objects as before (but skip those with mask:true)
    map.objects.forEach((o,i)=>{
      if (o.mask) return;
      if (o.img && status[`obj_${key}_${i}`]==='loaded'){
        ctx.drawImage(images[`obj_${key}_${i}`], o.x, o.y, o.w, o.h);
      }
    });
  } else {
    // Optionally, you could draw some overlay objects here mapped to the side view.
    // For now we keep it simple and don't draw map.objects in side view.
  }

  // Draw other players:
  for(const id in otherPlayers){
    const p = otherPlayers[id];
    if(p.mapX===mapX && p.mapY===mapY){
      const img = getImage(p);
      // compute virtual representation for that remote player
      const v = computeVirtualForPlayer(`${p.mapX},${p.mapY}`, p.x, p.y);
      if(v.virtualActive && v.viewImageKey && status[v.viewImageKey] === 'loaded'){
        // side view rendering: compute position from red/white/blue/purple params
        // red -> horizontal placement; white -> vertical offset; blue -> scale; purple -> visibility/blur
        const params = v.params;
        const red = params.red || 0;   // 0..1
        const white = params.white || 0;
        const blue = params.blue || 0;
        const purple = params.purple || 0;

        // compute screen X from red: 100% -> left, 50% -> center, 0% -> right
        const screenX = lerp(W - p.size, p.size, red); // mapping reversed so red=1 => left
        // compute screenY baseline: put near bottom of view (e.g., H*0.75) then lift by white*offset
        const baseY = H * 0.75;
        const yOffset = lerp(0, -60, white); // white pushes up if non-zero
        const screenY = baseY + yOffset;

        const scale = lerp(0.8, 1.6, blue); // blue scales between min and max
        const alpha = clamp(1 - purple, 0, 1); // purple=1 => fully hidden
        const blur = purple > 0.4 && purple < 0.99; // intermediate -> blur

        if(img) drawVirtualAvatar(img, screenX, screenY, p.size, {scale, alpha, blur}, p.name);
      } else {
        // draw top-down avatar (legacy)
        const imgToDraw = img;
        if(imgToDraw) ctx.drawImage(imgToDraw, p.x, p.y, player.size, player.size);
        ctx.fillStyle='#fff'; ctx.font='12px sans-serif'; ctx.fillText(p.name||id,p.x,p.y-5);
      }
    }
  }

  // Draw local player (virtual or top-down)
  if(!player.hidden){
    const img = getImage(player);
    if(localVirtual.virtualActive && localVirtual.viewImageKey && status[localVirtual.viewImageKey] === 'loaded'){
      const params = localVirtual.params;
      const red = params.red || 0;
      const white = params.white || 0;
      const blue = params.blue || 0;
      const purple = params.purple || 0;

      const screenX = lerp(W - player.size, player.size, red);
      const baseY = H * 0.75;
      const yOffset = lerp(0, -60, white);
      const screenY = baseY + yOffset;

      const scale = lerp(0.8, 1.6, blue);
      const alpha = clamp(1 - purple, 0, 1);
      const blur = purple > 0.4 && purple < 0.99;

      if(img) drawVirtualAvatar(img, screenX, screenY, player.size, {scale, alpha, blur}, playerName);
    } else {
      // top-down draw
      const imgToDraw = img;
      if(imgToDraw) ctx.drawImage(imgToDraw, player.x, player.y, player.size, player.size);
      ctx.fillStyle='#fff'; ctx.font='16px sans-serif'; if(playerName) ctx.fillText(playerName,player.x,player.y-5);
    }
  }

  // HUD: map name, clock, notifications, chats (existing)
  ctx.fillStyle='#fff'; ctx.font='16px sans-serif'; ctx.fillText(map.name,10,20);
  const now = new Date();
  ctx.font='20px monospace';
  ctx.fillText(`${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`, W-110,24);

  const t = Date.now();
  for(let i=joinNotifications.length-1;i>=0;i--){
    if(t-joinNotifications[i].time>3000){ joinNotifications.splice(i,1); } else { ctx.fillStyle='yellow'; ctx.font='16px sans-serif'; ctx.fillText(`${joinNotifications[i].name}さんが出撃`,10,35); }
  }

  for(let i=activeChats.length-1;i>=0;i--){
    const c = activeChats[i];
    if(t-c.time>15000){ activeChats.splice(i,1); continue; }
    const x = c.userId===userId ? player.x : otherPlayers[c.userId]?.x || 0;
    const y = c.userId===userId ? player.y-20 : (otherPlayers[c.userId]?.y-20 || 0);
    ctx.font='14px sans-serif';
    const w = ctx.measureText(c.msg).width;
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.fillRect(x-4,y-20,w+8,20);
    ctx.fillStyle='black';
    ctx.fillText(c.msg,x,y-5);
  }
}

function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();

window.addEventListener('beforeunload', ()=>{ remove(ref(db,'players/'+userId)); });

/* --- Notes for designers / how to add a color-set for a map ---
1) Prepare the following files (matching canvas size or higher; CORS enabled):
   - collision_black.png (optional)         -> set as maps['x,y'].collisionBlack
   - area_color.png                         -> set as maps['x,y'].areaColor
   - color_yellow/white.png
   - color_yellow/purple.png
   - color_yellow/blue.png
   - color_yellow/red.png
   - color_yellow/view_side.png
2) In maps['x,y'] set:
   colorSets: { yellow: 'https://.../color_yellow' }
   areaColor: 'https://.../area_color.png'
   collisionBlack: 'https://.../collision_black.png'
3) Behavior:
   - If player's center pixel in areaColor is transparent -> normal top-down.
   - If that pixel is yellow/green/orange/pink -> the matching colorSets folder is activated.
   - white/purple/blue/red are sampled at player's center to compute vertical offset, visibility, scale, and x-position.
   - view_side.png will be drawn as the background while in virtual mode.
   - collisionBlack (or legacy collisionMask) still controls passability.
*/

</script>
</body>
