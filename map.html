<title>ユメっ子探せ</title>

body {
  margin: 0;

  color: #fff;
  font-family: sans-serif;
  overflow: hidden;
  position: relative;
  height: 100vh;
}
canvas {
  background: #000;
  border: 4px solid #fff;
  width: 400px;
  height: 300px;
  display: block;
}
#nameForm, #chatForm {
  display: flex;
  gap: 5px;
  margin-bottom: 5px;
  position: absolute;
  z-index: 10;
}
#nameForm input, #chatForm input {
  padding: 5px;
  font-size: 16px;
}
#chatForm input { flex: 1; }
#touchControls {
  position: absolute;
  bottom: 80px;
  display: flex;
  gap: 10px;
  z-index: 10;
}
.touchButton {
  width: 60px;
  height: 60px;
  background: rgba(255,255,255,0.3);
  color: #fff;
  font-size: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  user-select: none;
  touch-action: none;
}
#extraButtons {
  position: absolute;
  bottom: 150px;
  display:flex;
  gap:10px;
  z-index: 10;
}
#extraButtons .touchButton {
  background: rgba(0,200,255,0.4);
}

<body>

<form id="nameForm">
  <input type="text" id="playerName" placeholder="名前を入力" maxlength="10">
  <button type="submit">決定</button>
</form>

<form id="chatForm" style="top: 10px; left: 10px;">
  <input type="text" id="chatInput" placeholder="チャットを入力" maxlength="50">
  <button type="submit">送信</button>
</form>

<canvas id="game" width="400" height="300"></canvas>

<div id="touchControls" style="display:none;">
  <div class="touchButton" data-key="w">↑</div>
  <div class="touchButton" data-key="s">↓</div>
  <div class="touchButton" data-key="a">←</div>
  <div class="touchButton" data-key="d">→</div>
</div>

<div id="extraButtons" style="display:none;">
  <div class="touchButton" data-key="shift">しゃがむ</div>
  <div class="touchButton" data-key="space">探す</div>

const images = {};
const status = {};

function loadImage(key,src){
  const img = new Image();
  status[key] = 'loading';
  img.onload = ()=>status[key]='loaded';
  img.onerror = ()=>status[key]='error';
  img.src = src;
  images[key] = img;
}

for(const k in maps){
  loadImage(`bg_${k}`, maps[k].bg);
  maps[k].objects.forEach((o,i)=>{
    if(o.img) loadImage(`obj_${k}_${i}`, o.img);
  });
}

const keyState = {};

addEventListener('keydown', e=>{
  keyState[e.key.toLowerCase()] = true;
  if(e.key === 'Shift') player.shift = true;
  if(e.key === ' ' || e.key === 'Space') triggerSpaceEvent();
});

addEventListener('keyup', e=>{
  keyState[e.key.toLowerCase()] = false;
  if(e.key === 'Shift') player.shift = false;
});

document.querySelectorAll('.touchButton').forEach(btn=>{
  const key = btn.dataset.key;
  btn.addEventListener('touchstart', e=>{
    e.preventDefault();
    if(key==='shift') player.shift=true;
    else if(key==='space') triggerSpaceEvent();
    else keyState[key]=true;
  });
  btn.addEventListener('touchend', e=>{
    e.preventDefault();
    if(key==='shift') player.shift=false;
    else keyState[key]=false;
  });
});

function hit(a,b){
  return a.x<b.x+b.w && a.x+a.size>b.x && a.y<b.y+b.h && a.y+a.size>b.y;
}

let mapX = 0;
let mapY = 0;

function isOnGrass(){
  const key = `${mapX},${mapY}`;
  const map = maps[key];
  for(const obj of map.objects){
    if(obj.type==='grass' && hit(player,obj)) return true;
  }
  return false;
}

function triggerSpaceEvent(){
  if(isOnGrass()){
    const chatSound = new Audio('https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/kusa.mp3');
    chatSound.play();
    if(Math.random()<1/20){
      player.hidden=true;
      remove(ref(db,'players/'+userId));
      localStorage.setItem('playVideo','true');
      location.href='index.html';
    }
  }
}

function sendPosition(){
  if(player.hidden) return;
  set(ref(db,'players/'+userId),{
    x:player.x,
    y:player.y,
    mapX,
    mapY,
    name:playerName,
    dir:player.dir,
    moving:player.moving,
    crouch:player.crouch,
    timestamp:Date.now()
  });
}

const playersRef = ref(db,'players');

onValue(playersRef,snap=>{
  const data = snap.val()||{};
  for(const id in data){
    if(id!==userId) otherPlayers[id]=data[id];
  }
});

onChildRemoved(playersRef,snap=>{
  const id = snap.key;
  delete otherPlayers[id];
});
const joinNotifications = [];
const notifiedUsers = new Set();
const chime = new Audio('https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/Chime.mp3');
const enterTime = Date.now();

onChildAdded(playersRef, snapshot=>{
  const data = snapshot.val();
  const id = snapshot.key;
  if(id!==userId && !notifiedUsers.has(id)){
    notifiedUsers.add(id);
    if(Date.now()-enterTime>5000){
      chime.currentTime=0;
      chime.play();
      joinNotifications.push({ name:data.name||'名無し', time:Date.now() });
    }
  }
});

  e.preventDefault();
  const msg = chatInput.value.trim();
  if(!msg) return;
  chatInput.value='';
  push(chatsRef,{
    userId,
    name:playerName,
    msg,
    mapX,
    mapY,
    timestamp:Date.now()
  });
});

onChildAdded(chatsRef, snapshot=>{
  const chat = snapshot.val();
  if(chat.mapX===mapX && chat.mapY===mapY){
    if(Date.now()-enterTime<5000) return;
    activeChats = activeChats.filter(c=>c.userId!==chat.userId);
    activeChats.push({...chat,time:Date.now()});
    new Audio('https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/chat.mp3').play();
  }
});

setInterval(async ()=>{
  const now = Date.now();

  const playersSnap = await get(ref(db,'players'));
  const playersData = playersSnap.val() || {};
  for(const id in playersData){
    if(now - playersData[id].timestamp > 300000){
      remove(ref(db,'players/'+id));
    }
  }

  const chatsSnap = await get(ref(db,'chats'));
  const chatsData = chatsSnap.val() || {};
  for(const id in chatsData){
    if(now - chatsData[id].timestamp > 900000){
      remove(ref(db,'chats/'+id));
    }
  }
},60000);

function update(){
  const key = `${mapX},${mapY}`;
  if(!maps[key]) return;
  const map = maps[key];
  const ox = player.x;
  const oy = player.y;

  player.moving = false;
  player.crouch = player.shift;

  if(keyState.w){ player.y-=player.speed; player.dir='up'; player.moving=true; }
  if(keyState.s){ player.y+=player.speed; player.dir='down'; player.moving=true; }
  if(keyState.a){ player.x-=player.speed; player.dir='left'; player.moving=true; }
  if(keyState.d){ player.x+=player.speed; player.dir='right'; player.moving=true; }

  for(const obj of map.objects){
    if(hit(player,obj)){
      if(obj.type==='block'){ player.x=ox; player.y=oy; }
      if(obj.type==='warp'){
        player.x=obj.to.x;
        player.y=obj.to.y;
        mapX=0; mapY=0;
      }
    }
  }

  let nx=mapX, ny=mapY;
  if(player.x<0) nx--;
  if(player.x+player.size>W) nx++;
  if(player.y<0) ny--;
  if(player.y+player.size>H) ny++;

  if(maps[`${nx},${ny}`]){
    mapX=nx; mapY=ny;
    if(player.x<0) player.x=W-player.size;
    if(player.x+player.size>W) player.x=0;
    if(player.y<0) player.y=H-player.size;
    if(player.y+player.size>H) player.y=0;
  }else{
    player.x=ox; player.y=oy;
  }

  if(playerName) sendPosition();
}

function getImage(p){
  if(p.crouch) return sprites.crouch[p.dir];
  if(p.moving) return sprites.walk[p.dir];
  return sprites.idle[p.dir];
}

function draw(){
  const key = `${mapX},${mapY}`;
  const map = maps[key];

  if(status[`bg_${key}`]==='loaded'){
    ctx.drawImage(images[`bg_${key}`],0,0,W,H);
  }else{
    ctx.fillStyle='#333';
    ctx.fillRect(0,0,W,H);
  }

  map.objects.forEach((o,i)=>{
    if(o.img && status[`obj_${key}_${i}`]==='loaded'){
      ctx.drawImage(images[`obj_${key}_${i}`],o.x,o.y,o.w,o.h);
    }
  });

  for(const id in otherPlayers){
    const p = otherPlayers[id];
    if(p.mapX===mapX && p.mapY===mapY){
      const img = getImage(p);
      if(img) ctx.drawImage(img,p.x,p.y,player.size,player.size);
      ctx.fillStyle='#fff';
      ctx.font='12px sans-serif';
      ctx.fillText(p.name||id,p.x,p.y-5);
    }
  }

  if(!player.hidden){
    const img = getImage(player);
    if(img) ctx.drawImage(img,player.x,player.y,player.size,player.size);
    ctx.fillStyle='#fff';
    ctx.font='16px sans-serif';
    if(playerName) ctx.fillText(playerName,player.x,player.y-5);
  }

  ctx.fillStyle='#fff';
  ctx.font='16px sans-serif';
  ctx.fillText(map.name,10,20);

  const now = new Date();
  ctx.font='20px monospace';
  ctx.fillText(
    `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`,
    W-110,24
  );

  const t = Date.now();
  for(let i=joinNotifications.length-1;i>=0;i--){
    if(t-joinNotifications[i].time>3000){
      joinNotifications.splice(i,1);
    }else{
      ctx.fillStyle='yellow';
      ctx.font='16px sans-serif';
      ctx.fillText(`${joinNotifications[i].name}さんが出撃`,10,35);
    }
  }

  for(let i=activeChats.length-1;i>=0;i--){
    const c = activeChats[i];
    if(t-c.time>15000){
      activeChats.splice(i,1);
      continue;
    }
    const x = c.userId===userId ? player.x : otherPlayers[c.userId]?.x || 0;
    const y = c.userId===userId ? player.y-20 : (otherPlayers[c.userId]?.y-20 || 0);
    ctx.font='14px sans-serif';
    const w = ctx.measureText(c.msg).width;
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.fillRect(x-4,y-20,w+8,20);
    ctx.fillStyle='black';
    ctx.fillText(c.msg,x,y-5);
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
loop();

window.addEventListener('beforeunload',()=>{
  remove(ref(db,'players/'+userId));
});
</script>
</body>
</html>
