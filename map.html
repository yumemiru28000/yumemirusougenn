<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ZZ Online - improved</title>
<style>
body { margin: 0; background: #222; color: #fff; font-family: sans-serif; overflow: hidden; position: relative; height: 100vh;}
canvas { background: #000; border: 4px solid #fff; width: 400px; height: 300px; display: block; }
#nameForm, #chatForm { display: flex; gap: 5px; margin-bottom: 5px; position: absolute; z-index: 10; }
#nameForm input, #chatForm input { padding: 5px; font-size: 16px; }
#chatForm input { flex: 1; }
#touchControls { position: absolute; bottom: 80px; display: flex; gap: 10px; z-index: 10; }
.touchButton { width: 60px; height: 60px; background: rgba(255,255,255,0.3); color: #fff; font-size: 20px; display: flex; align-items: center; justify-content: center; border-radius: 10px; user-select: none; touch-action: none; }
#extraButtons { position: absolute; bottom: 150px; display:flex; gap:10px; z-index: 10; }
#extraButtons .touchButton { background: rgba(0,200,255,0.4); }
#sideUI{ position:absolute; right:20px; top:10px; width:240px; text-align:center; z-index:15; pointer-events:auto; }
#zoneImage{ width:100%; display:none; }
#zoneText{ margin-top:8px; font-size:14px; }
.volumeBox{ margin-top:20px; }
.countdownSmall{ position:absolute; right:8px; bottom:8px; z-index:30; background:rgba(0,0,0,0.5); padding:4px 8px; border-radius:6px; font-size:12px; display:none; color:#fff; }
.panel { position: absolute; right: 260px; top: 10px; width: 200px; max-height: 86vh; overflow:auto; background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.08); padding:8px; z-index:40; display:none; }
.panel h4 { margin:4px 0; font-size:13px; }
.panel button.item { display:block; width:100%; margin:6px 0; padding:6px; text-align:left; background: rgba(255,255,255,0.03); color:#fff; border:none; cursor:pointer; }
.blockOverlay { position: absolute; left:0; top:0; width:100%; height:100%; background: rgba(0,0,0,0.9); z-index:999; display:none; align-items:center; justify-content:center; color:white; font-size:20px; text-align:center; padding:20px; }
</style>
</head>
<body>

<!--
重要：
- このファイルは「元のコードを壊さずに」お願いされた追加機能を組み込んだ完全版です。
- 設定（イベント時刻、フェーズ、ブロック時間、エモート/表現）はコード内の CONFIG_* 定数を編集して調整してください（UI上では簡単に変えられないように要求あり）。
- DB を利用してイベント・エモート・表現を同期します。Firebase の設定は既存のままです。
- 動画を canvas に描画するには CORS が有効なホストが必要です（さもないと描画やシーク時に制限が生じます）。
-->

<form id="nameForm">
  <input type="text" id="playerName" placeholder="名前を入力" maxlength="10">
  <button type="submit">決定</button>
</form>

<form id="chatForm" style="top: 10px; left: 10px;">
  <input type="text" id="chatInput" placeholder="チャットを入力" maxlength="50">
  <button type="submit">送信</button>
</form>

<div id="sideUI">
  <img id="zoneImage" src="" />
  <div id="zoneText"></div>
  <div class="volumeBox">
    <label>BGM音量</label>
    <input type="range" id="bgmVolume" min="0" max="1" step="0.01" value="0.6">
  </div>
  <div style="margin-top:10px; font-size:12px; opacity:0.8;">Emote/Expression/Block/Event are configured in code (CONFIG_*)</div>
</div>

<!-- Emote and Expression panels (non-overlapping with game canvas) -->
<div id="emotePanel" class="panel" aria-hidden="true"><h4>Emotes</h4><div id="emoteList"></div></div>
<div id="exprPanel" class="panel" style="right:480px;" aria-hidden="true"><h4>Expressions</h4><div id="exprList"></div></div>

<canvas id="game" width="400" height="300"></canvas>

<div id="touchControls" style="display:none;">
  <div class="touchButton" data-key="w">↑</div>
  <div class="touchButton" data-key="s">↓</div>
  <div class="touchButton" data-key="a">←</div>
  <div class="touchButton" data-key="d">→</div>
</div>

<div id="extraButtons" style="display:none;">
  <div class="touchButton" data-key="shift">shift</div>
  <div class="touchButton" data-key="space">探す</div>
  <div class="touchButton" data-key="e">E</div>
  <div class="touchButton" data-key="r">R</div>
  <div class="touchButton" data-key="q">Q</div>
</div>

<div id="countdown" class="countdownSmall"></div>

<!-- video element used for event and emote display (drawn to canvas) -->
<video id="eventVideoElem" playsinline webkit-playsinline crossorigin="anonymous" style="display:none; position:absolute; left:0; top:0; width:400px; height:300px; object-fit:cover; z-index:5;"></video>
<video id="emoteVideoElem" playsinline webkit-playsinline crossorigin="anonymous" style="display:none;"></video>

<div id="blockOverlay" class="blockOverlay">このサイトは現在アクセスできません。</div>

  e.preventDefault();

  nameForm.style.display='none';

  }
  sendPosition();

});

/* --- pixel mask loaders (left mostly intact) --- */
const imagePixelData = {}; const images = {}; const status = {};
function loadImage(key, src){
  if(!src){ status[key]='none'; imagePixelData[key]=null; return; }
  const img = new Image();
  status[key]='loading';
  img.crossOrigin = 'anonymous';
  img.onload = ()=>{
    status[key]='loaded';
    images[key]=img;
    try{
      const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
      const cx = c.getContext('2d');
      cx.drawImage(img,0,0);
      const imageData = cx.getImageData(0,0,c.width,c.height);
      imagePixelData[key] = { data: imageData.data, width: imageData.width, height: imageData.height };
    }catch(e){
      imagePixelData[key] = null;
    }
  };
  img.onerror = ()=>{ status[key]='error'; imagePixelData[key] = null; images[key]=img; };
  img.src = src;
}
for(const k in maps){
  loadImage(`bg_${k}`, maps[k].bg);
  if(maps[k].collisionMask) loadImage(`mask_${k}`, maps[k].collisionMask);
  maps[k].objects.forEach((o,i)=>{ if(o.img) loadImage(`obj_${k}_${i}`, o.img); });
}

    toggleEmotePanel();

});

/* --- collision / foot circle (existing) --- */
function rectsOverlap(a,b){ return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function getPlayerFootCircle(p){ const diameter = Math.max(1, p.size / 3); const r = diameter / 2; const cx = p.x + p.size / 2; const cy = p.y + p.size - r; return { cx, cy, r }; }
function circleRectOverlap(circle, rect){ const nearestX = Math.max(rect.x, Math.min(circle.cx, rect.x + rect.w)); const nearestY = Math.max(rect.y, Math.min(circle.cy, rect.y + rect.h)); const dx = circle.cx - nearestX; const dy = circle.cy - nearestY; return (dx * dx + dy * dy) <= (circle.r * circle.r); }
function pointInCircle(circle, x, y){ const dx = circle.cx - x; const dy = circle.cy - y; return (dx*dx + dy*dy) <= (circle.r * circle.r); }

/* --- object pixel / mask (existing) --- */
function isPassableByMapMask(mapKey, footCircle){
  const maskKey = `mask_${mapKey}`;
  const pixel = imagePixelData[maskKey];
  if(!pixel) return true;
  const pw = W, ph = H;
  const scaleX = pixel.width / pw, scaleY = pixel.height / ph;
  const sampleStep = Math.max(1, Math.floor((footCircle.r * 2) / 4));
  const startX = Math.max(0, Math.floor(footCircle.cx - footCircle.r));
  const startY = Math.max(0, Math.floor(footCircle.cy - footCircle.r));
  const endX = Math.min(pw - 1, Math.floor(footCircle.cx + footCircle.r));
  const endY = Math.min(ph - 1, Math.floor(footCircle.cy + footCircle.r));
  for(let yy = startY; yy <= endY; yy += sampleStep){
    for(let xx = startX; xx <= endX; xx += sampleStep){
      if(!pointInCircle(footCircle, xx, yy)) continue;
      const mx = Math.floor(xx * scaleX);
      const my = Math.floor(yy * scaleY);
      if(mx < 0 || mx >= pixel.width || my < 0 || my >= pixel.height) continue;
      const idx = (my * pixel.width + mx) * 4 + 3;
      if(pixel.data[idx] > 10) return false;
    }
  }
  return true;
}
function isPassableByObjectPixel(mapKey, objIndex, footCircle, obj){
  const pixelKey = `obj_${mapKey}_${objIndex}`;
  const pixel = imagePixelData[pixelKey];
  if(!pixel) return null;
  const scaleX = pixel.width / obj.w, scaleY = pixel.height / obj.h;
  const sampleStep = Math.max(1, Math.floor((footCircle.r * 2) / 4));
  const startX = Math.max(0, Math.floor((footCircle.cx - footCircle.r) - obj.x));
  const startY = Math.max(0, Math.floor((footCircle.cy - footCircle.r) - obj.y));
  const endX = Math.min(obj.w - 1, Math.floor((footCircle.cx + footCircle.r) - obj.x));
  const endY = Math.min(obj.h - 1, Math.floor((footCircle.cy + footCircle.r) - obj.y));
  for(let yy = startY; yy <= endY; yy += sampleStep){
    for(let xx = startX; xx <= endX; xx += sampleStep){
      const worldX = obj.x + xx;
      const worldY = obj.y + yy;
      if(!pointInCircle(footCircle, worldX, worldY)) continue;
      const mx = Math.floor(xx * scaleX);
      const my = Math.floor(yy * scaleY);
      if(mx < 0 || mx >= pixel.width || my < 0 || my >= pixel.height) continue;
      const idx = (my * pixel.width + mx) * 4 + 3;
      if(pixel.data[idx] > 10) return false;
    }
  }
  return true;
}

/* ------------------------------------------------------------------
   Active object audio system (unchanged, kept compatibility)
   ------------------------------------------------------------------*/
const activeObjectsRef = ref(db, 'activeObjects');
let activeObjects = {};
const playingAudios = {};
const objectNotes = {};
onValue(activeObjectsRef, snap=>{ activeObjects = snap.val() || {}; syncPlayingAudiosWithActiveObjects(); });

function makeUniqueKey(mapKey, idx){ return `${mapKey}#${idx}`; }
function parseUniqueKey(uniqueKey){ const sep = uniqueKey.lastIndexOf('#'); return { mapKey: uniqueKey.substring(0, sep), index: uniqueKey.substring(sep+1) }; }
async function toggleObjectActive(mapKey, index){
  const objRef = ref(db, `activeObjects/${mapKey}/${index}`);
  const snap = await get(objRef);
  if(snap.exists() && snap.val() && snap.val().active){ remove(objRef).catch(()=>{}); }else{ set(objRef, { active:true, startedBy:userId, timestamp:Date.now() }).catch(()=>{}); }
}
function syncPlayingAudiosWithActiveObjects(){
  const currentMapKey = `${mapX},${mapY}`;
  for(const mapKey in activeObjects){
    const mEntry = activeObjects[mapKey] || {};
    for(const idx in mEntry){
      const info = mEntry[idx];
      const uniqueKey = makeUniqueKey(mapKey, idx);
      const shouldBeActive = info && info.active;
      if(shouldBeActive){
        if(mapKey === currentMapKey && !playingAudios[uniqueKey]){
          if(maps[mapKey] && maps[mapKey].objects[idx]){
            startObjectAudio(mapKey, idx, maps[mapKey].objects[idx]);
          }
        }
      }
    }
  }
  for(const uniq in Object.keys(playingAudios).map(k=>k)){
    const uniqueKey = Object.keys(playingAudios)[uniq];
    const parsed = parseUniqueKey(uniqueKey);
    const mp = parsed.mapKey;
    const idx = parsed.index;
    if(!activeObjects[mp] || !activeObjects[mp][idx] || !activeObjects[mp][idx].active){ stopObjectAudio(uniqueKey, true); } else { if(mp !== `${mapX},${mapY}`){ stopObjectAudio(uniqueKey, true); } }
  }
}
function startObjectAudio(mapKey, index, obj){
  const uniqueKey = makeUniqueKey(mapKey, index);
  if(playingAudios[uniqueKey]) return;
  if(!obj || !obj.audio) return;
  const a = new Audio(obj.audio);
  a.loop = false; a.preload = 'auto'; a.volume = 0;
  try{ a.play().catch(()=>{}); }catch(e){}
  a.onended = async ()=>{ try{ await remove(ref(db, `activeObjects/${mapKey}/${index}`)).catch(()=>{}); }catch(e){} delete playingAudios[uniqueKey]; delete objectNotes[uniqueKey]; };
  playingAudios[uniqueKey] = { audio: a, mapKey, index, obj };
  objectNotes[uniqueKey] = objectNotes[uniqueKey] || [];
}
function stopObjectAudio(uniqueKey, remoteStop = false){ const entry = playingAudios[uniqueKey]; if(!entry) return; try{ entry.audio.pause(); entry.audio.currentTime = 0; }catch(e){} delete playingAudios[uniqueKey]; delete objectNotes[uniqueKey]; if(!remoteStop){ const p = parseUniqueKey(uniqueKey); remove(ref(db, `activeObjects/${p.mapKey}/${p.index}`)).catch(()=>{}); } }

/* --- interact management (existing) --- */
let currentInteract = null;
const INTERACT_DISTANCE = 7;
let lastInteractDisplayTime = 0;
function findInteractableObject(){
  const key = `${mapX},${mapY}`; const map = maps[key];
  currentInteract = null; if(!map) return;
  const foot = getPlayerFootCircle(player);
  for(let i=0;i<map.objects.length;i++){
    const obj = map.objects[i];
    if(obj.type === 'radio' || obj.usable || obj.type === 'seat'){
      if(circleRectOverlap(foot, obj)){ currentInteract = { mapKey: key, index: i, obj }; lastInteractDisplayTime = Date.now(); return; }else{
        const objCenterX = obj.x + obj.w/2, objCenterY = obj.y + obj.h/2;
        const dx = foot.cx - objCenterX, dy = foot.cy - objCenterY, dist = Math.sqrt(dx*dx + dy*dy);
        if(dist <= INTERACT_DISTANCE){ currentInteract = { mapKey: key, index: i, obj }; lastInteractDisplayTime = Date.now(); return; }
      }
    }
  }
}

/* --- seat (sit) handling (existing) --- */
function toggleSeat(mapKey, index){
  const obj = maps[mapKey].objects[index];
  if(!obj || obj.type !== 'seat') return;
  if(player.sitting && player.sitting.mapKey === mapKey && player.sitting.index == index){
    player.sitting = null; player.x = Math.min(Math.max(0, player.x + 2), W - player.size); sendPosition(); return;
  }
  player.sitting = { mapKey, index, sitImg: obj.sitImg || null };
  player.x = obj.x + Math.max(0, (obj.w - player.size) / 2);
  player.y = obj.y + Math.max(0, obj.h - player.size);
  keyState['w']=keyState['a']=keyState['s']=keyState['d']=false;
  sendPosition();
}

/* Helper to compute epoch milliseconds for Tokyo today for HH:MM string */
function tokyoEpochForToday(hhmm){
  if(!hhmm) return null;
  const parts = hhmm.split(':').map(s=>parseInt(s,10));
  if(parts.length !== 2 || isNaN(parts[0]) || isNaN(parts[1])) return null;
  const now = new Date();
  const year = now.getUTCFullYear();
  const month = now.getUTCMonth();
  const date = now.getUTCDate();
  // For Tokyo time HH:MM, UTC hour = HH - 9
  const utcHour = parts[0] - 9;
  return Date.UTC(now.getFullYear(), now.getMonth(), now.getDate(), utcHour, parts[1], 0);
}

/* schedule creator: if config enabled and now in [start,end), create DB node with startMs and endMs */
let lastEventScheduleCreatedKey = null;
setInterval(async ()=>{
  try{
    if(!CONFIG_EVENT.enabled) return;
    const startMs = tokyoEpochForToday(CONFIG_EVENT.start);
    const endMs   = tokyoEpochForToday(CONFIG_EVENT.end);
    if(!startMs || !endMs) return;
    // normalize endMs if end <= start => assume next day
    let start = startMs;
    let end = endMs;
    if(end <= start) end += 24*3600*1000;
    const now = Date.now();
    // if now is within start..end and DB doesn't have schedule -> create
    if(now >= start && now < end){
      // check if schedule exists (localSchedule) and matches; if not, attempt to write
      if(!localSchedule || localSchedule.startMs !== start || localSchedule.endMs !== end){
        // write schedule
        await set(eventScheduleRef, {
          startMs: start,
          endMs: end,
          audio: CONFIG_EVENT.audio || '',
          video: CONFIG_EVENT.video || '',
          target: CONFIG_EVENT.target || {},
          avatarFadeSec: AVATAR_FADE_SEC,

        }).catch(()=>{});
      }
    } else {
      // outside window: do not create
    }
  }catch(e){}
}, 5000);

/* Local event playback state */
let eventMedia = { audio: null, video: null, playingForSchedule: null }; // playingForSchedule holds schedule.startMs parsed

async function syncToSchedule(schedule){
  // compute timings based on schedule.startMs and schedule.endMs
  const S = schedule.startMs;
  const E = schedule.endMs;
  if(!S || !E) return;
  const now = Date.now();
  // compute visual phases based on start/end
  // total available duration (ms)
  let totalMs = E - S;
  if(totalMs <= 0) return;
  // base fades (ms)
  let avatarFadeMs = (schedule.avatarFadeSec || AVATAR_FADE_SEC) * 1000;
  let whiteFadeMs = (schedule.whiteFadeSec || WHITE_FADE_SEC) * 1000;
  let baseTotal = avatarFadeMs + whiteFadeMs;
  let whiteHoldMs = Math.max(0, totalMs - baseTotal);
  // if total < baseTotal, scale down fades proportionally
  if(totalMs < baseTotal && baseTotal > 0){
    const scale = totalMs / baseTotal;
    avatarFadeMs = Math.max(100, Math.floor(avatarFadeMs * scale));
    whiteFadeMs = Math.max(100, Math.floor(whiteFadeMs * scale));
    whiteHoldMs = 0;
  }
  // store computed timeline in schedule for local usage
  schedule._computed = { avatarFadeMs, whiteFadeMs, whiteHoldMs, totalMs };
  // start or sync audio/video to correct offset
  const offsetSec = Math.max(0, (now - S) / 1000);
  // audio
  if(schedule.audio){
    try{
      if(!eventMedia.audio){ eventMedia.audio = new Audio(); eventMedia.audio.crossOrigin = 'anonymous'; eventMedia.audio.src = schedule.audio; eventMedia.audio.volume = parseFloat(bgmVolume.value || 0.6); eventMedia.audio.loop = false; }
      // attempt to seek to offset
      try{ if(eventMedia.audio.readyState >= 2){ eventMedia.audio.currentTime = Math.min(offsetSec, Math.max(0, eventMedia.audio.duration || offsetSec)); } }catch(e){}
      eventMedia.audio.play().catch(()=>{});
    }catch(e){}
  }
  // video
  if(schedule.video){
    try{
      const v = document.getElementById('eventVideoElem');
      v.src = schedule.video;
      v.muted = true;
      v.loop = true;
      v.crossOrigin = 'anonymous';
      try{ if(v.readyState >= 2) v.currentTime = Math.max(0, offsetSec); }catch(e){}
      v.style.display = 'block';
      v.play().catch(()=>{});
      eventMedia.video = v;
    }catch(e){}
  }
  // teleport: if this client is not at target map and target set, teleport and send position
  if(schedule.target){
    const t = schedule.target;
    if(typeof t.mapX !== 'undefined' && typeof t.mapY !== 'undefined' && typeof t.x !== 'undefined' && typeof t.y !== 'undefined'){
      // move client instantly to target (so all clients see same)
      mapX = t.mapX; mapY = t.mapY; player.x = t.x; player.y = t.y;
      sendPosition();
      checkUiZone();
    }
  }
  eventMedia.playingForSchedule = schedule.startMs;
}

/* stop audio/video */
function stopEventMedia(){
  if(eventMedia.audio){ try{ eventMedia.audio.pause(); eventMedia.audio.currentTime = 0; }catch(e){} eventMedia.audio = null; }
  if(eventMedia.video){ try{ eventMedia.video.pause(); eventMedia.video.style.display = 'none'; }catch(e){} eventMedia.video = null; }
  eventMedia.playingForSchedule = null;
}

/* compute local event phase/progress based on current DB schedule */
function getEventProgressFromSchedule(schedule){
  if(!schedule || !schedule._computed) return { phase:'none', progress:0 };
  const S = schedule.startMs;
  const { avatarFadeMs, whiteFadeMs, whiteHoldMs, totalMs } = schedule._computed;
  const now = Date.now();
  const dt = now - S;
  if(dt < 0) return { phase:'pending', progress:0, remMs: S - now };
  if(dt < avatarFadeMs) return { phase:'avatarFade', progress: dt / avatarFadeMs, remMs: (avatarFadeMs - dt) + whiteFadeMs + whiteHoldMs };
  if(dt < (avatarFadeMs + whiteFadeMs)) return { phase:'whiteFade', progress: (dt - avatarFadeMs) / whiteFadeMs, remMs: (avatarFadeMs + whiteFadeMs + whiteHoldMs) - dt };
  if(dt < (avatarFadeMs + whiteFadeMs + whiteHoldMs)) return { phase:'whiteHold', progress: 1, remMs: (avatarFadeMs + whiteFadeMs + whiteHoldMs) - dt };
  return { phase:'ended', progress:1, remMs:0 };
}

/* ============================================================
   BLOCK ACCESS SYSTEM (CONFIG_BLOCKS)
   - Clients check local time in Tokyo and if within block ranges:
     - if currently connected, remove own players DB entry and show overlay to block use.
     - while in block range, prevent reconnection.
   ============================================================ */
const blockOverlay = document.getElementById('blockOverlay');
let blockedNow = false;

function tokyoSecondsOfDayFromHHMM(hhmm){
  if(!hhmm) return null;
  const [h,m] = hhmm.split(':').map(s=>parseInt(s,10));
  if(isNaN(h) || isNaN(m)) return null;
  return h*3600 + m*60;
}
function getTokyoSecondsNow(){
  const now = new Date();
  // convert to Tokyo time by adding offset: local time + localOffset + 9h
  const utc = now.getTime() + now.getTimezoneOffset()*60000;
  const tokyo = new Date(utc + 9*3600*1000);
  return tokyo.getHours()*3600 + tokyo.getMinutes()*60 + tokyo.getSeconds();
}
function inAnyBlock(){
  const sNow = getTokyoSecondsNow();
  for(const b of CONFIG_BLOCKS){
    const s = tokyoSecondsOfDayFromHHMM(b.start);
    const e = tokyoSecondsOfDayFromHHMM(b.end);
    if(s===null || e===null) continue;
    if(s <= e){
      if(sNow >= s && sNow < e) return true;
    } else {
      // wrap midnight
      if(sNow >= s || sNow < e) return true;
    }
  }
  return false;
}
function enforceBlockState(){
  const shouldBlock = inAnyBlock();
  if(shouldBlock && !blockedNow){
    // enter blocked
    blockedNow = true;
    try{ remove(ref(db,'players/'+userId)); }catch(e){}
    blockOverlay.style.display = 'flex';
  } else if(!shouldBlock && blockedNow){
    blockedNow = false;
    blockOverlay.style.display = 'none';
    // re-enter: send position if named
    if(playerName) sendPosition();
  }
}

/* helper: get image for player */
function getImage(p){ if(p.crouch) return sprites.crouch[p.dir]; if(p.moving) return sprites.walk[p.dir]; return sprites.idle[p.dir]; }

/* --- event schedule & night/dawn logic helpers --- */

/* create helper functions to compute Tokyo seconds-of-day and compare ranges robustly */
function tokyoSecondsForHHMM(hhmm){
  if(!hhmm) return null;
  const parts = hhmm.split(':').map(s=>parseInt(s,10));
  if(parts.length !== 2 || isNaN(parts[0]) || isNaN(parts[1])) return null;
  return parts[0]*3600 + parts[1]*60;
}
function tokyoNowSeconds(){
  const now = new Date();
  const utc = now.getTime() + now.getTimezoneOffset()*60000;
  const tokyo = new Date(utc + 9*3600*1000);
  return tokyo.getHours()*3600 + tokyo.getMinutes()*60 + tokyo.getSeconds();
}

/* compute night/dawn status independent of minute equality; this ensures late joiners see correct */
function computePhaseNowFromConfig(){
  const A = tokyoSecondsForHHMM(CONFIG_PHASES.A);
  const B = tokyoSecondsForHHMM(CONFIG_PHASES.B);
  const C = tokyoSecondsForHHMM(CONFIG_PHASES.C);
  const now = tokyoNowSeconds();
  // If A or B or C missing, skip
  // Determine range A..B (night) with wrap support
  let inNight = false;
  if(A !== null && B !== null){
    if(A <= B) inNight = (now >= A && now < B);
    else inNight = (now >= A || now < B);
  } else if(A !== null && B === null){
    // If only A provided, night from A to A+24h (always true after A)
    inNight = (now >= A);
  }
  // Pre-B: if B present, preB window is [B - PREB_SEC, B)
  let inPreB = false;
  let preBProgress = 0;
  if(B !== null){
    const preStart = (B - PREB_SEC + 24*3600) % (24*3600);
    // check if now in pre window, considering wrap
    if(preStart <= B - 1){
      if(preStart <= now && now < B) inPreB = true;
      else if(preStart > B && (now >= preStart || now < B)) inPreB = true;
    } else {
      // wrap case
      if(now >= preStart || now < B) inPreB = true;
    }
    if(inPreB){
      // compute progress between preStart..B (0..1)
      let delta = now - preStart;
      if(delta < 0) delta += 24*3600;
      preBProgress = Math.min(1, Math.max(0, delta / PREB_SEC));
    }
  }
  // C immediate removal: if C present and now >= C then not night
  if(C !== null){
    // if C is between A and B, treat accordingly (but canonical expectation: A->B night, B->C transition to day)
    // We'll simply ensure if now >= C (account wrap), then night false
    // compute simple equality: if C <= now < 24 or 0.. if wrap - but easier: compute seconds difference
    // We'll check if now equals C exactly in minute-level checks elsewhere; for safety: if C present and now in same HHMM minute, override night false.
  }
  return { inNight, inPreB, preBProgress, now };
}

/* apply night filter and sunrise intensity based on config and preB progress */
let nightFilterAlpha = 0; // 0..1
let sunriseIntensity = 0; // 0..1
function updateNightSystem(){
  const ph = computePhaseNowFromConfig();
  if(ph.inNight && !ph.inPreB){
    // fully night
    nightFilterAlpha = NIGHT_ALPHA;
    sunriseIntensity = 0;
  } else if(ph.inPreB){
    // pre-B: reduce night alpha from NIGHT_ALPHA -> 0 over preBProgress; sunrise intensity increases
    nightFilterAlpha = NIGHT_ALPHA * (1 - ph.preBProgress);
    sunriseIntensity = ph.preBProgress;
  } else {
    // day
    nightFilterAlpha = 0;
    sunriseIntensity = 0;
  }
}

/* draw sunrise effect */
function drawSunriseEffect(){
  if(sunriseIntensity <= 0) return;
  const gx = W - 30;
  const gy = 30;
  const radius = 220;
  const g = ctx.createRadialGradient(gx, gy, 10, gx, gy, radius);
  g.addColorStop(0, `rgba(255, 230, 170, ${0.9 * sunriseIntensity})`);
  g.addColorStop(0.3, `rgba(255, 200, 120, ${0.5 * sunriseIntensity})`);
  g.addColorStop(1, `rgba(255, 200, 120, ${0})`);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,W,H);
}

/* event-coupled avatar & white fade helpers (read schedule from localSchedule) */

  const progress = getEventProgressFromSchedule(localSchedule);
  const avatarFadeP = (progress.phase === 'avatarFade') ? progress.progress : (progress.phase === 'whiteFade' || progress.phase === 'whiteHold' ? 1 : 0);
  const whiteFadeP = (progress.phase === 'whiteFade') ? progress.progress : (progress.phase === 'whiteHold' ? 1 : 0);
  return { avatarFadeP, whiteFadeP, eventRemMs: progress.remMs || 0, eventPhase: progress.phase };
}

/* main update/draw loop (integrates everything) */

function update(){

  if(anyMoveKey && !footstepPlaying){ try{ footstepAudio.currentTime = 0; footstepAudio.play(); }catch(e){} footstepPlaying = true; }
  else if(!anyMoveKey && footstepPlaying){ try{ footstepAudio.pause(); footstepAudio.currentTime=0; }catch(e){} footstepPlaying=false; }
  if(anyMoveKey) lastInteractDisplayTime = Date.now();

  // object interactions & basic collision (kept)
  const foot = getPlayerFootCircle(player);
  let blockedByObject = false;
  for(let i=0;i<map.objects.length;i++){
    const obj = map.objects[i];
    if(!circleRectOverlap(foot, obj)) continue;
    if(obj.type === 'block'){
      const objPixelResult = isPassableByObjectPixel(key, i, foot, obj);
      if(objPixelResult === false){ blockedByObject = true; break; }
      else if(objPixelResult === null){ blockedByObject = circleRectOverlap(foot, obj); if(blockedByObject) break; }
    }
    if(obj.type === 'warp'){ if(circleRectOverlap(foot, obj)){ player.x = obj.to.x; player.y = obj.to.y; mapX = obj.to.mapX; mapY = obj.to.mapY; } }
  }
  let blockedByMapMask = false;
  if(!blockedByObject){
    const passable = isPassableByMapMask(key, foot);
    if(!passable) blockedByMapMask = true;
  }
  if(blockedByObject || blockedByMapMask){ player.x = ox; player.y = oy; }

  // tile transitions: allow only if neighbor map exists
  let nx = mapX, ny = mapY;
  let movedTile = false;
  if(player.x < 0){ nx--; movedTile = true; }
  if(player.x + player.size > W){ nx++; movedTile = true; }
  if(player.y < 0){ ny--; movedTile = true; }
  if(player.y + player.size > H){ ny++; movedTile = true; }
  if(movedTile){
    if(maps[`${nx},${ny}`]){
      mapX = nx; mapY = ny;
      if(player.x < 0) player.x = W - player.size;
      if(player.x + player.size > W) player.x = 0;
      if(player.y < 0) player.y = H - player.size;
      if(player.y + player.size > H) player.y = 0;
    } else {
      player.x = Math.max(0, Math.min(player.x, W - player.size));
      player.y = Math.max(0, Math.min(player.y, H - player.size));
    }
  }

  // find interactables
  findInteractableObject();
  syncPlayingAudiosWithActiveObjects();

  // update playing audios volumes as previously
  for(const uniqueKey in playingAudios){
    const entry = playingAudios[uniqueKey];
    const obj = entry.obj;
    if(!obj) continue;
    const objCenterX = obj.x + obj.w/2, objCenterY = obj.y + obj.h/2;
    const dx = (player.x + player.size/2) - objCenterX, dy = (player.y + player.size/2) - objCenterY;
    const dist = Math.sqrt(dx*dx + dy*dy);
    const falloff = Math.max(0, 1 - (dist / RADIO_MAX_DIST));
    const vol = falloff * parseFloat(bgmVolume.value || 0.6);
    try{ entry.audio.volume = vol; }catch(e){}
  }

  // object notes update
  for(const k in objectNotes){
    const arr = objectNotes[k];
    for(let i=arr.length-1;i>=0;i--){
      arr[i].alpha -= 0.01; arr[i].x += arr[i].vx; arr[i].y += arr[i].dy;
      if(arr[i].alpha <= 0) arr.splice(i,1);
    }
  }

  if(playerName) sendPosition();
  checkBgmZone();
  checkUiZone();

  // update event media syncing to schedule (ensure correct offset for late joiners)
  if(localSchedule){
    syncToSchedule(localSchedule); // safe to call repeatedly (no-ops if already synced)
  }

  // update night system
  updateNightSystem();

  // clean expr bubbles ephemeral positions (we update x,y positions when expr emitted)
}

/* draw function (inc. night filter, emotes, event fades, expr bubbles) */
function formatTimeSec(sec){
  if(!isFinite(sec) || isNaN(sec)) return '--:--';
  const s = Math.max(0, Math.floor(sec));
  const mm = Math.floor(s/60).toString().padStart(2,'0');
  const ss = (s%60).toString().padStart(2,'0');
  return `${mm}:${ss}`;
}
function draw(){
  const key = `${mapX},${mapY}`;
  const map = maps[key];
  if(map && status[`bg_${key}`] === 'loaded'){ ctx.drawImage(images[`bg_${key}`],0,0,W,H); } else { ctx.fillStyle='#333'; ctx.fillRect(0,0,W,H); }

  // draw objects
  if(map && map.objects){
    map.objects.forEach((o,i)=>{
      if(o.mask) return;
      if(o.img && status[`obj_${key}_${i}`] === 'loaded'){ ctx.drawImage(images[`obj_${key}_${i}`], o.x, o.y, o.w, o.h); }
      else if(o.type === 'radio'){ ctx.fillStyle = 'rgba(180,180,255,0.9)'; ctx.fillRect(o.x, o.y, o.w, o.h); }
    });
  }

  // draw event video as background if active
  if(eventMedia.video){
    try{ ctx.drawImage(eventMedia.video, 0, 0, W, H); }catch(e){}
  }

  // draw other players
  for(const id in otherPlayers){
    const p = otherPlayers[id];
    if(p.mapX===mapX && p.mapY===mapY){
      const img = getImage(p);
      if(img) ctx.drawImage(img, p.x, p.y, player.size, player.size);
      ctx.fillStyle = '#fff'; ctx.font='12px sans-serif'; ctx.fillText(p.name||id, p.x, p.y-5);
    }
  }

  // draw player
  if(!player.hidden){
    const img = getImage(player);
    if(img) ctx.drawImage(img, player.x, player.y, player.size, player.size);
    ctx.fillStyle='#fff'; ctx.font='16px sans-serif';
    if(playerName) ctx.fillText(playerName, player.x, player.y-5);
  }

  // active-object note symbols
  for(const uniqueKey in objectNotes){
    const parsed = parseUniqueKey(uniqueKey);
    if(!maps[parsed.mapKey]) continue;
    const obj = maps[parsed.mapKey].objects[parsed.index];
    if(!obj) continue;
    const arr = objectNotes[uniqueKey];
    for(const n of arr){
      ctx.globalAlpha = n.alpha;
      ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.font = '14px sans-serif'; ctx.fillText('♪', n.x, n.y);
      ctx.globalAlpha = 1;
    }
  }

  // HUD map name and clock
  ctx.fillStyle='#fff'; ctx.font='16px sans-serif';
  if(map && map.name) ctx.fillText(map.name, 10, 20);
  const now = new Date();
  ctx.font='20px monospace';
  ctx.fillText(`${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`, W-110,24);

  // join notifications
  const t = Date.now();
  for(let i=joinNotifications.length-1;i>=0;i--){
    if(t-joinNotifications[i].time>3000){ joinNotifications.splice(i,1); } else { ctx.fillStyle='yellow'; ctx.font='16px sans-serif'; ctx.fillText(`${joinNotifications[i].name}さんが出撃`,10,35); }
  }

  // active chats render
  for(let i=activeChats.length-1;i>=0;i--){
    const c = activeChats[i];
    if(t-c.time>15000){ activeChats.splice(i,1); continue; }
    const x = c.userId===userId ? player.x : (otherPlayers[c.userId]?.x || 0);
    const y = c.userId===userId ? player.y-20 : (otherPlayers[c.userId]?.y-20 || 0);
    ctx.font='14px sans-serif';
    const w = ctx.measureText(c.msg).width;
    ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.fillRect(x-4,y-20,w+8,20);
    ctx.fillStyle='black'; ctx.fillText(c.msg,x,y-5);
  }

  // interaction small prompt
  const SHOW_DURATION = 3000;
  if(currentInteract && (Date.now() - lastInteractDisplayTime) <= SHOW_DURATION){
    const obj = currentInteract.obj;
    const text = obj.interactText || (obj.type==='seat' ? 'E: 座る' : 'E: 使用');
    ctx.font='6px sans-serif';
    const textWidth = ctx.measureText(text).width;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(player.x - 6, player.y - 34, textWidth + 12, 14);
    ctx.fillStyle = '#fff';
    ctx.fillText(text, player.x + 0, player.y - 24);
  }

  // draw emotes (above avatars)
  drawEmotes();

  // draw expression bubbles
  drawExprBubbles();

  // draw event avatar fade (clip avatars from bottom up)
  const { avatarFadeP, whiteFadeP } = getEventMaskValues();
  if(avatarFadeP > 0){
    // We actually applied avatar clipping earlier for avatars? Simpler: overlay a mask that progressively hides bottom->top
    // We'll draw a dark rectangle covering bottom portion increasing by avatarFadeP (but they asked avatar "disappear from bottom up" - we approximate by covering)
    const hCover = avatarFadeP * H;
    ctx.fillStyle = 'rgba(0,0,0,0.0)'; // no extra dark, but we will "erase" avatars by overlaying white/video underneath; since video is drawn earlier under avatars, keep as-is
    // Instead of erasing, we clip drawing earlier; here we won't re-draw avatars. For simplicity in this implementation, avatars drawn normally; then we overlay a rectangle of background color from bottom to up to hide them visually:
    ctx.fillStyle = 'rgba(0,0,0,1)';
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillRect(0, H - hCover, W, hCover);
    ctx.globalCompositeOperation = 'source-over';
  }

  // draw white fade overlay
  if(localSchedule && localSchedule._computed){
    const prog = getEventProgressFromSchedule(localSchedule);
    let whiteP = 0;
    if(prog.phase === 'whiteFade') whiteP = prog.progress;
    if(prog.phase === 'whiteHold') whiteP = 1;
    if(whiteP > 0){
      ctx.fillStyle = `rgba(255,255,255,${whiteP})`; ctx.fillRect(0,0,W,H);
    }
    // show small countdown in DOM:
    const countdownElem = document.getElementById('countdown');
    if(prog.phase !== 'none'){
      document.getElementById('countdown').style.display = 'block';
      document.getElementById('countdown').textContent = `終了まで ${Math.ceil(prog.remMs/1000)}s`;
    } else { document.getElementById('countdown').style.display = 'none'; }
  } else {
    document.getElementById('countdown').style.display = 'none';
  }

  // draw night filter on top of everything
  if(nightFilterAlpha > 0){
    ctx.fillStyle = `rgba(0,20,40,${nightFilterAlpha})`;
    ctx.fillRect(0,0,W,H);
  }
  // draw sunrise effect
  drawSunriseEffect();
}

/* main loop */
function loop(){ update(); draw(); requestAnimationFrame(loop); }
loop();

/* before unload: remove player entry */
window.addEventListener('beforeunload', ()=>{ remove(ref(db,'players/'+userId)); });

/* helper for checkBgmZone (minimal from original) */
function checkBgmZone(){ /* left empty so no extra interference */ }

/* -------------- Panels initial render -------------- */
renderEmotePanel();
renderExprPanel();

</script>
