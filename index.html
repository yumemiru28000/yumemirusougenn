  <style>
    :root {

    html, body { height:100%; margin:0; overflow:hidden; font-family:system-ui, -apple-system, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; background-color:#d2e879; background:url('https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/home.png') center/cover no-repeat; color:var(--accent);}

#versionLabel {
  position: fixed;
  left: 8px;
  bottom: 6px;
  font-size: 13px;
  color: rgba(0,0,0,0.45);
  background: rgba(255,255,255,0.35);

  border-radius: 6px;
  pointer-events: none;
  z-index: 9999;
}


/* === 水色ゲーム風 時間表示パネル === */
.time-panel {
  margin: 16px auto;
  padding: 12px 16px;
  max-width: 360px;
  background: linear-gradient(180deg, #e8f7ff, #cfefff);
  border: 3px solid #7fd3ff;
  border-radius: 14px;
  box-shadow:
    inset 0 0 0 2px #ffffff,
    0 4px 0 #6bbfe6;
  text-align: center;
}

/* 点線風の区切り */
.time-panel .line {
  color: #426f80;
  letter-spacing: -1px;
  font-size: 12px;
  margin: 6px 0;
  overflow: hidden;
  white-space: nowrap;
}

/* メイン時間表示 */
.game-time {
  font-size: 18px;
  font-weight: bold;
  color: #00bbff;
  background: #ffffff;
  padding: 8px 10px;
  border-radius: 10px;
  border: 2px solid #9edcff;
  box-shadow: inset 0 -2px 0 #dff4ff;
}

/* & をゲームUIっぽく */
.game-time .ampersand {
  color:#324f7d;
  font-weight: bold;
  margin: 0 6px;
}




 /* お知らせ一覧 */
.osirase-list{
  align-items: flex-start; 
  display: flex;
  flex-direction: row;
  gap: 16px;

  overflow-x: auto;        /* ← 横スクロール有効 */
  overflow-y: hidden;
  white-space: nowrap;

  padding: 16px;
  box-sizing: border-box;

  width: 100vw;
  height: auto;

  -webkit-overflow-scrolling: touch; /* スマホ慣性 */
}

/* スクロールバーが邪魔なら薄く */
.osirase-list::-webkit-scrollbar{
  height: 8px;
}
.osirase-list::-webkit-scrollbar-thumb{
  background: rgba(0,0,0,0.25);
  border-radius: 4px;
}



/* お知らせカード */
.osirase-item{
  position: relative;
  display: inline-flex;
  flex-direction: column;

  justify-content: center;   /* ← 縦中央に寄せる */
  align-items: center;       /* ← 横も中央 */

  gap: 6px;

  background: rgba(255,255,255,0.9);
  border-radius: 14px;
  padding: 10px;

  transform: scale(0.8);
  transform-origin: top left;

  margin-right: 8px;
  margin-bottom: 12px;

  box-shadow: 0 4px 10px rgba(0,0,0,0.25);
}



.osirase-item img{
  display: block;
  max-height: 260px;
  height: auto;
  margin: 0 auto;   /* ← 中央寄せ */
}


.osirase-text{
  margin: 0;                 /* ← 重要 */
  padding: 6px 4px;
  font-size: 14px;
  color: #333;
  line-height: 1.6;

  white-space: pre-wrap;     /* ← 改行は保持しつつ */
  text-align: left;          /* ← 読みやすく */
}



/* NEW表示（背景方式・確定版） */
.osirase-item.is-new::after{
  content: "";
  position: absolute;
  top: 6px;
  right: 6px;
 width: 72px;          /* ← 3倍 */
  height: 72px;
  background-image: url("https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/pop_new.png");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  z-index: 3;
  pointer-events: none;
}


/* |||運営パスワード＋時間カード 横並び|||| */
.admin-row {
  display: flex;
  gap: 6px;               /* 枠間を近づける */
  justify-content: center;
  align-items: stretch;    /* 高さを揃える */
  margin-top: 14px;
}

/* パスワード入力カード */
.admin-input {
  padding: 2px 8px;       /* 縦を小さく */

/* time-panel 内文字調整 */
.time-panel p,

/* 運営パスワード：中央下 */

<script>
// =====================
// クリック効果音
// =====================

// 効果音のURL（差し替え可能）
const clickSoundUrl = "https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/botan_b25.mp3";

// Audioオブジェクトを使い回し（高速）
const clickSound = new Audio(clickSoundUrl);
clickSound.volume = 0.9; // 音量調整（0〜1）

// すべてのボタン・img・a クリックで音を鳴らす
function setupClickSound() {
  document.body.addEventListener("click", function(e) {
    const tag = e.target.tagName.toLowerCase();

    if (["button", "img", "a", "input"].includes(tag)) {
      // 音を毎回最初から再生できるようにする
      clickSound.currentTime = 0;
      clickSound.play().catch(()=>{});
    }
  });
}

// ページ読み込み後にセットアップ
window.addEventListener("DOMContentLoaded", setupClickSound);
</script>

  <script>
  /* =========================
     共通関数・カードフィット
  ========================= */
  function fitCard() {
    const wrap = document.querySelector('.card-wrapper');
    const card = document.querySelector('.card');
    const wh = window.innerHeight;
    const ch = card.offsetHeight;
    const scale = Math.min(1, wh / (ch + 20));
    wrap.style.transform = `scale(${scale})`;
  }
  window.addEventListener('resize', fitCard);
  window.addEventListener('load', fitCard);

  function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    const el = document.getElementById(id);
    if (!el) return;
    el.classList.add('active');
    setTimeout(fitCard, 50);
  }

  /* =========================
     時間管理
  ========================= */
  const config = {
    videos: [
      { id:'v1', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/1o.mp4', weight:6 },
      { id:'v2', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/1x.mp4', weight:1 },
      { id:'v3', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/2o.mp4', weight:6 },
      { id:'v4', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/2x.mp4', weight:1 },
      { id:'v5', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/3o.mp4', weight:6 },
      { id:'v6', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/3x.mp4', weight:1 },
      { id:'v7', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/4o.mp4', weight:4 },
      { id:'v8', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/4x.mp4', weight:1 },
      { id:'v9', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/5o.mp4', weight:4 },
      { id:'v10', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/5x.mp4', weight:1 },
      { id:'v11', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/6o.mp4', weight:4 },
      { id:'v12', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/6x.mp4', weight:1 },
      { id:'v13', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/7o.mp4', weight:4 },
      { id:'v14', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/7x.mp4', weight:1 },
      { id:'v15', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/8x.mp4', weight:2,frame: "odd"},
      { id:'v16', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/9x.mp4', weight:1,frame: "odd"},
      { id:'v17', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/1oc.mp4', weight:5, frame: "even"},
      { id:'v18', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/2oc.mp4', weight:4, frame: "even"},
      { id:'v19', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/3oc.mp4', weight:3, frame: "even"},
      { id:'v20', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/4oc.mp4', weight:3, frame: "even"},
      { id:'v21', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/5oc.mp4', weight:2, frame: "even" },
      { id:'v22', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/6oc.mp4', weight:2, frame: "even"},
      { id:'v23', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/7oc.mp4', weight:2, frame: "even" },
      { id:'v24', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/10o.mp4', weight:25 },
      { id:'v25', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/10oc.mp4', weight:6, frame: "even" },
      { id:'v26', url:'https://raw.githubusercontent.com/yumemiru28000/yumemirusougenn/main/11o.mp4', weight:4,}
    ],
    bypassPassword:'1122',
    allowedTimes:[{hour:6, startMinute:0, endMinute:2},
    {hour:22, startMinute:0, endMinute:2}]
  };

  function nowJST() {
    const d = new Date();
    return new Date(d.getTime() + d.getTimezoneOffset() * 60000 + 9*3600*1000);
  }

  function isWithinAllowedWindow() {
    const j = nowJST();
    for (const t of config.allowedTimes) {
      const s = new Date(j); s.setHours(t.hour, t.startMinute,0,0);
      const e = new Date(j); e.setHours(t.hour, t.endMinute,59,999);
      if (j>=s && j<=e) return true;
    }
    return false;
  }

  function getNextStart() {
    const j = nowJST();
    let next = null;
    for(const t of config.allowedTimes){
      const s = new Date(j); s.setHours(t.hour, t.startMinute,0,0);
      if(s>j && (!next||s<next)) next=s;
    }
    if(!next){
      const t = config.allowedTimes[0];
      next = new Date(j.getTime()+24*3600*1000);
      next.setHours(t.hour,t.startMinute,0,0);
    }
    return next;
  }

  /* =========================
     タイムバー更新
  ========================= */
  function updateRemaining(){
    const j=nowJST();
    const pw=document.getElementById('pw').value===config.bypassPassword;
    const joinBtnImg=document.getElementById('joinBtnImg');
    const tDiv=document.getElementById('remainingTime');
    const bar=document.getElementById('timeBar');
    const allowed=isWithinAllowedWindow()||pw;

    joinBtnImg.style.pointerEvents=allowed?'auto':'none';

const TAB_KEY = 'myYumekoTabLock';

const TIMEOUT_MS = 5 * 60 * 1000;   // 5分

function checkTabLock(){
  const j = nowJST();
  if(!isWithinAllowedWindow()) return;

  const now = j.getTime();
  const lockRaw = localStorage.getItem(TAB_KEY);

  if(lockRaw){
    const lock = JSON.parse(lockRaw);

    // 他タブが生存していたらブロック
    if(lock.tabId !== TAB_ID && now - lock.time < TIMEOUT_MS){
      alert('このサイトはすでに別タブで開かれています。\n5分後に解除されます。');
      document.body.innerHTML =
        '<h1 style="text-align:center;margin-top:40vh;color:red;">別タブで利用中です</h1>';
      throw new Error('TAB LOCKED');
    }
  }

  // 自分のタブでロック登録
  localStorage.setItem(TAB_KEY, JSON.stringify({
    tabId: TAB_ID,
    time: now
  }));
}

window.addEventListener('load', checkTabLock);

    const text = document.createElement("div");
    text.className = "osirase-text";
    text.textContent = data.text;

    item.appendChild(img);
    item.appendChild(text);
    list.appendChild(item);
  });
}

let currentZukanData = null;
let addCharData = null;
let addZukanData = null;

function openZukanAdd(){
  const panel = document.getElementById('zukanPanel');
  panel.innerHTML = '';

  panel.innerHTML = `
    <h3>キャラを図鑑に追加</h3>

    <button id="loadCharQR">🖼 キャラQRを読み込む</button>
    <div id="charStatus">未読み込み</div>

    <button id="loadZukanQR">📘 図鑑QRを読み込む</button>
    <div id="zukanStatus">未読み込み</div>

    <button id="applyAdd" disabled>➕ 追加</button>

    <div id="newZukanQR"></div>
    <button id="saveNewZukan" class="hidden">📥 新しい図鑑QRを保存</button>

    <input type="file" id="zukanFileInput" accept="image/*" hidden>
    <input type="file" id="charFileInput" accept="image/*" hidden>
  `;

  document.getElementById('loadCharQR').onclick =
    () => document.getElementById('charFileInput').click();

  document.getElementById('loadZukanQR').onclick =
    () => document.getElementById('zukanFileInput').click();

  document.getElementById('charFileInput').onchange =
    e => readQRFile(e.target.files[0], 'char');

  document.getElementById('zukanFileInput').onchange =
    e => readQRFile(e.target.files[0], 'zukan');

  document.getElementById('applyAdd').onclick = applyAddToZukan;
}

function readQRFile(file, type){
  if(!file) return;

  const img = new Image();
  img.src = URL.createObjectURL(file);

  img.onload = () => {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img,0,0);

    const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
    const code = jsQR(imageData.data, canvas.width, canvas.height);

    if(!code){
      alert('QRが読み取れません');
      return;
    }

    const data = JSON.parse(code.data);

    if(type === 'char'){
      addCharData = data;
      document.getElementById('charStatus').textContent =
        `読み込み済み：${data.id}`;
    }

    if(type === 'zukan'){
      addZukanData = data;
      document.getElementById('zukanStatus').textContent =
        `図鑑読み込み済み（${Object.keys(data.chars||{}).length}体）`;
    }

    checkAddReady();
  };
}
    
function checkAddReady(){
  const btn = document.getElementById('applyAdd');
  if(addCharData && addZukanData){
    btn.disabled = false;
  }
}

function applyAddToZukan(){
  // 念のためコピー
  const newZukan = JSON.parse(JSON.stringify(addZukanData));

  if(!newZukan.chars){
    newZukan.chars = {};
  }

  // IDをキーにして丸ごと追加
  newZukan.chars[addCharData.id] = addCharData;

  // 新しいQR表示
  const qrArea = document.getElementById('newZukanQR');
  qrArea.innerHTML = '';

  const canvas = document.createElement('canvas');
  qrArea.appendChild(canvas);

  QRCode.toCanvas(
    canvas,
    JSON.stringify(newZukan),
    { width: 260 }
  );

  // 保存ボタン表示
  const saveBtn = document.getElementById('saveNewZukan');
  saveBtn.classList.remove('hidden');

  saveBtn.onclick = () => {
    const a = document.createElement('a');
    a.href = canvas.toDataURL('image/png');
    a.download = 'zukan_updated.png';
    a.click();
  };
}



    
function createEmptyZukan(){
  currentZukanData = {
    version: 1,
    chars: {}
  };
  renderZukanQR();
}

function renderZukanQR(){
  const panel = document.getElementById('zukanPanel');
  panel.innerHTML = '';

  const canvas = document.createElement('canvas');
  panel.appendChild(canvas);

  QRCode.toCanvas(

    const a = document.createElement('a');

}
function openZukanAdd(){
  const panel = document.getElementById('zukanPanel');
  panel.innerHTML = `
    <p>キャラQR画像を選んでください</p>
    <input type="file" id="zukanCharInput" accept="image/*">
  `;

  document.getElementById('zukanCharInput').onchange = e => {
    const file = e.target.files[0];
    if(!file) return;
    readCharQRAndAdd(file);
  };
}
function readCharQRAndAdd(file){
  if(!currentZukanData){
    alert('先に図鑑QRを作成・読み込みしてください');
    return;
  }

  const img = new Image();
  img.src = URL.createObjectURL(file);

  img.onload = () => {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img,0,0);

    const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
    const qr = jsQR(imageData.data,canvas.width,canvas.height);
    if(!qr){ alert('QRが読めません'); return; }

    const data = JSON.parse(qr.data);
    currentZukanData.chars[data.id] = data;

    renderZukanQR(); // 更新された図鑑QRを再生成
  };
}
function openZukanView(){
  const panel = document.getElementById('zukanPanel');
  panel.innerHTML = `
    <p>図鑑QRを選択してください</p>
    <input type="file" id="zukanLoadInput" accept="image/*">
  `;

  document.getElementById('zukanLoadInput').onchange = e=>{
    const file = e.target.files[0];
    if(!file) return;
    loadZukanQR(file);
  };
}
function loadZukanQR(file){
  const img = new Image();
  img.src = URL.createObjectURL(file);

  img.onload = ()=>{
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = img.width;
    canvas.height = img.height;
    ctx.drawImage(img,0,0);

    const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
    const qr = jsQR(imageData.data,canvas.width,canvas.height);
    if(!qr){ alert('QRが読めません'); return; }

    currentZukanData = JSON.parse(qr.data);

    const panel = document.getElementById('zukanPanel');
    panel.innerHTML = '<h3>所持キャラ一覧</h3>';

    Object.values(currentZukanData.chars).forEach(c=>{
      const div = document.createElement('div');
      div.innerHTML = `
        <img src="${c.img}" style="width:80px">
        <div>${c.id}</div>
      `;
      panel.appendChild(div);
    });
  };
}
